name: V2 Room-first Firebase Emulator
on:
  push:
    branches:
      - refactor/unified-core-and-school-network-20261027
    paths:
      - 'v2/core/shared-room.mjs'
      - 'v2/session/room-coordinator.mjs'
      - 'v2/net/firebase-room-lobby-rest.mjs'
      - 'firebase/trump-rooms-v2.rules.json'
      - 'firebase.room-v2-emulator.json'
      - 'tests/v2-room-emulator.e2e.mjs'
      - 'tests/v2-firebase-lobby-rest.test.mjs'
      - '.github/workflows/room-v2-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-first-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Unit tests for room transitions and REST adapter
        run: node --test tests/v2-shared-room.test.mjs tests/v2-firebase-lobby-rest.test.mjs
      - name: Four-UID room-first flow and RTDB Rules in isolated emulator
        run: npx --yes firebase-tools@15.30.1 emulators:exec --project demo-trumpcards --config firebase.room-v2-emulator.json --only auth,database "node --test tests/v2-room-emulator.e2e.mjs"
