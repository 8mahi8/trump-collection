name: Isolated Firebase Auth + RTDB Emulator Tests
on:
  push:
    branches:
      - dev/quality-and-ui-v1-5-20261024
    paths:
      - '.github/workflows/firebase-emulator-ci.yml'
      - 'firebase/**'
      - 'firebase.emulator.json'
      - 'online/**'
      - 'games.mjs'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firebase-authz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Node logic and mock transport regression tests
        run: node --test tests/*.test.mjs
      - name: Emulator authentication + database authorization and full matches
        run: npx --yes firebase-tools@15.30.1 emulators:exec --project demo-trumpcards --config firebase.emulator.json --only auth,database "node --test tests/firebase-emulator.e2e.mjs"
