name: V2 Room-first UI Safari and Chromium Emulator
on:
  push:
    branches:
      - refactor/unified-core-and-school-network-20261027
    paths:
      - 'v2/online-app.mjs'
      - 'v2/session/**'
      - 'v2/net/**'
      - 'v2/core/**'
      - 'v2/games/**'
      - 'online/four-seat-authority.mjs'
      - 'v2/online-lab.html'
      - 'v2/ui/**'
      - 'v2/build/build-online-lab.mjs'
      - 'dev/verify-v2-online-ui.mjs'
      - 'dev/verify-v2-configured-sites-build.mjs'
      - 'firebase/trump-rooms-v2-friends-emulator.rules.json'
      - 'firebase.room-v2-friends-emulator.json'
      - '.github/workflows/room-v2-ui-emulator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  room-ui-emu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pin build tools and browser engines
        run: |
          npm install --no-save esbuild@0.25.12 playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Static check for offline Google Sites connection configuration
        run: node dev/verify-v2-configured-sites-build.mjs
      - name: Prepare offline school trial HTML with known shared RTDB address
        run: |
          node v2/build/build-online-lab.mjs \
            --database-url https://mygame-df915-default-rtdb.firebaseio.com \
            --out dist/v2-room-first-sites-school-trial.html
          test -s dist/v2-room-first-sites-school-trial.html
      - name: Build one HTML for Google Sites-style isolated lab
        run: node v2/build/build-online-lab.mjs
      - name: Four touch browsers and Firebase mock auth + actual RTDB emulator
        run: npx --yes firebase-tools@15.30.1 emulators:exec --project demo-trumpcards --config firebase.room-v2-friends-emulator.json --only database "node dev/verify-v2-online-ui.mjs && TC_BROWSER_ENGINE=webkit node dev/verify-v2-online-ui.mjs"
      - name: Upload isolated V2 preview for developer inspection only
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-room-first-online-preview-only
          path: |
            dist/v2-room-first-online-lab.html
            dist/v2-room-first-sites-school-trial.html
            dist/v2-screens/online-*.png
          retention-days: 7
          if-no-files-found: ignore
