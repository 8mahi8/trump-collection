name: V2 Memory CPU Browser Emulator
on:
  push:
    branches:
      - refactor/unified-core-and-school-network-20261027
    paths:
      - 'v2/**'
      - 'dev/verify-v2-memory-cpu-ui.mjs'
      - 'firebase/trump-rooms-v2-friends-emulator.rules.json'
      - 'firebase.room-v2-friends-emulator.json'
      - '.github/workflows/room-v2-memory-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  memory-cpu-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare build tools and Safari/Chromium
        run: |
          npm install --no-save esbuild@0.25.12 playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Create isolated one-file Google Sites-style preview
        run: node v2/build/build-online-lab.mjs
      - name: Play actual 1-human plus CPU Memory in both engines (no Auth)
        run: npx --yes firebase-tools@15.30.1 emulators:exec --project demo-trumpcards --config firebase.room-v2-friends-emulator.json --only database "node dev/verify-v2-memory-cpu-ui.mjs && TC_BROWSER_ENGINE=webkit node dev/verify-v2-memory-cpu-ui.mjs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v2-memory-cpu-screen-proof
          path: dist/v2-screens/memory-cpu-*.png
          retention-days: 7
          if-no-files-found: ignore
