<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>トランプコレクション｜2人神経衰弱 通信ラボ</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,"Hiragino Sans",sans-serif;background:#0b412c;color:#fff}body{overflow:auto}
main{max-width:980px;margin:auto;padding:12px 16px 22px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(18px,3vw,27px);margin:6px 0}h2{font-size:17px;margin:9px 0}
aside{font-size:12px;line-height:1.6;color:#eacb8e}
.panel{padding:12px;border-radius:13px;background:#15573b;border:1px solid #3c8763;margin:9px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{margin:2px 0}
button,input{font:inherit;border:0;border-radius:9px;min-height:44px}
button{background:#ffdf65;color:#1b3024;font-weight:700;padding:8px 16px;cursor:pointer}button:disabled{opacity:.4;cursor:default}
button.alt{background:#e6f6e9}input{background:#fff;color:#18231f;padding:8px 12px;width:126px}
#room{font-size:23px;font-weight:800;letter-spacing:2px;color:#ffe17c}#status{font-size:14px;line-height:1.6;min-height:20px}
#board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(3px,0.8vw,9px);width:min(560px,95vw);margin:4px auto}
.tile{width:100%;aspect-ratio:0.73;min-height:0;padding:0;display:flex;align-items:center;justify-content:center;flex-direction:column;border-radius:8px;border:2px solid #edf6eb;background:linear-gradient(140deg,#2d65aa,#16386d);color:#fff;font-size:clamp(12px,2vw,21px);touch-action:manipulation}
.tile.face{background:#f7f6ed;color:#182a35}.tile.red{color:#cb3c49}.tile.taken{visibility:hidden}.tile:disabled:not(.face){opacity:.73}
#notice{font-size:15px;font-weight:700;color:#ffe17c}#gameArea{display:none}
#lobby{display:none}
@media(max-height:480px){
body.playing #connect{display:none}
body.playing header aside{display:none}
body.playing #lobby .row:nth-child(2){display:none}
body.playing #board{grid-template-columns:repeat(12,minmax(0,1fr));width:min(660px,94vw)}
body.playing .panel{padding:4px 8px}
body.playing #notice{font-size:11px}
main{padding:3px 12px}h1{font-size:16px}header aside{font-size:10px}.panel{margin:4px 0;padding:5px 9px}#board{width:min(480px,90vw)}.tile{font-size:14px;border-radius:5px;border-width:1px}.row{gap:4px}button,input{min-height:38px}#status{font-size:12px}}
</style></head>
<body><main>
<header><h1>🃏 神経衰弱｜2人ルーム研究室</h1><aside>検証用：同じサイトを開いた別タブで通信するラボ。<strong>まだ離れた端末同士のオンライン対戦ではありません。</strong></aside></header>
<section id="connect" class="panel">
  <div class="row"><button id="create">ルームを作る</button><input id="code" inputmode="numeric" maxlength="5" pattern="[0-9]*" placeholder="5桁の番号" aria-label="ルーム番号"><button id="join" class="alt">ルームに参加</button></div>
  <div id="status" aria-live="polite">ホスト用タブで作成 → もう1つのタブで番号を入力</div>
</section>
<section id="lobby" class="panel">
  <div class="row"><span>ルーム：<span id="room"></span></span><span id="seat"></span><span id="players"></span></div>
  <div class="row"><button id="ready">準備OK</button><button id="start">対戦開始</button><button id="again">再戦ロビーへ</button></div>
  <div id="notice"></div>
</section>
<section id="gameArea" class="panel">
  <div class="row"><span id="turn"></span><span id="score"></span></div><div id="board" aria-label="神経衰弱のカード24枚"></div>
</section>
</main>
<script type="module">
import {ROOM_PROTOCOL,createMemoryAuthority,makeRoomCommand} from './memory-authority.mjs';
const $=id=>document.getElementById(id);
let authority=null, channel=null, currentView=null, localCode='',isHost=false, actor='',actionSeq=0,settleTimer=null;
const suits=['♠','♥','♦','♣'];
const randomToken=()=>{const a=new Uint32Array(3);crypto.getRandomValues(a);return Array.from(a,x=>x.toString(36)).join('-');};
const randomRoom=()=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return String(10000 + a[0]%90000)};
const status=(s)=>{$('status').textContent=s};
function closeRoom(){if(channel)channel.close();channel=null;if(settleTimer)clearTimeout(settleTimer);settleTimer=null;authority=null;currentView=null;}
function setup(code,host){closeRoom();actor=randomToken();localCode=code;isHost=host;channel=new BroadcastChannel('trump-memory-lab-'+code);
  channel.onmessage=e=>{const m=e.data;if(!m||m.protocol!==ROOM_PROTOCOL||m.roomCode!==localCode)return;
    if(isHost&&m.kind==='command'){const r=authority.apply(m.action);if(r.ok)sendView();else {channel.postMessage({kind:'error',protocol:ROOM_PROTOCOL,roomCode:localCode,target:m.action.actor,reason:r.reason});sendView();}scheduleSettle();}
    if(!isHost&&m.kind==='view'){const first=!currentView;currentView=m.view;if(first)status('参加できました。準備OKを押してください');render();}
    if(!isHost&&m.kind==='error'&&m.target===actor)status('操作を受理できません：'+m.reason+'（最新状態を受信します）');
    if(isHost&&m.kind==='sync')sendView();
  };$('lobby').style.display='block';
}
function sendView(){if(!authority)return;currentView=authority.publicView();render();channel?.postMessage({kind:'view',protocol:ROOM_PROTOCOL,roomCode:localCode,view:currentView});}
function send(type,extra={}){if(!currentView)return;const cmd=makeRoomCommand(currentView,actor,type,actor+'-'+(++actionSeq),extra);
  if(isHost){const res=authority.apply(cmd);if(!res.ok){status('操作不可：'+res.reason);return;}sendView();scheduleSettle();}
  else channel?.postMessage({kind:'command',protocol:ROOM_PROTOCOL,roomCode:localCode,action:cmd});}
function scheduleSettle(){if(!isHost||!authority?.publicView().locked||settleTimer)return;
  settleTimer=setTimeout(()=>{settleTimer=null;if(authority?.settle())sendView()},1000);
}
$('create').onclick=()=>{
  const code=randomRoom();setup(code,true);
  authority=createMemoryAuthority({roomCode:code,hostId:actor});sendView();
  status('ルーム '+code+' を作成。別タブで参加してください');
};
$('join').onclick=()=>{
  const code=$('code').value.trim();
  if(!/^[0-9]{5}$/.test(code)){status('5桁のルーム番号を入力してください');return;}
  setup(code,false);status('参加申請中：'+code);
  // joinは既存ルームが進んでいてもOK。存在しなければ相手の返信は届かない。
  channel.postMessage({kind:'command',protocol:ROOM_PROTOCOL,roomCode:code,
    action:{protocol:ROOM_PROTOCOL,roomCode:code,actor,actionId:actor+'-'+(++actionSeq),expectedRevision:0,round:0,type:'join'}});
  channel.postMessage({kind:'sync',protocol:ROOM_PROTOCOL,roomCode:code});
  setTimeout(()=>{if(!currentView&&!isHost&&localCode===code)status('ホストが見つかりません。同じブラウザの別タブでホストを開いてください')},3500);
};
$('ready').onclick=()=>{const v=currentView;send('ready',{ready:!v.players[isHost?0:1].ready})};
$('start').onclick=()=>send('start');
$('again').onclick=()=>send('rematch');
function render(){
 const v=currentView;if(!v)return;
 document.body.classList.toggle('playing',v.phase==='playing'||v.phase==='finished');
 $('room').textContent=v.roomCode;
 const mine=isHost?0:1;
 $('seat').textContent='｜'+(isHost?'ホスト':'ゲスト');
 $('players').textContent='｜'+v.players.filter(p=>p.present).length+'/2人';
 $('ready').disabled=v.phase!=='lobby'||!v.players[mine]?.present;
 $('ready').textContent=v.players[mine]?.ready?'準備を解除':'準備OK';
 $('start').style.display=isHost?'':'none';
 $('start').disabled=v.phase!=='lobby'||!v.players.every(p=>p.present&&p.ready);
 $('again').style.display=(isHost&&v.phase==='finished')?'':'none';
 $('notice').textContent=v.phase==='lobby'?'両者の準備後、ホストが開始':v.phase==='finished'?(v.winner===-1?'引き分け':'勝者：'+(v.winner===mine?'あなた':'相手')):v.locked?'2枚の結果を確認中…':'';
 $('gameArea').style.display=(v.phase==='playing'||v.phase==='finished')?'block':'none';
 $('turn').textContent='手番：'+(v.turn===mine?'あなた':'相手');
 $('score').textContent='｜あなた '+v.scores[mine]+'ペア・相手 '+v.scores[1-mine]+'ペア';
 const board=$('board');board.replaceChildren();
 v.cards.forEach((c,i)=>{const b=document.createElement('button');b.className='tile';b.type='button';b.setAttribute('aria-label',i+1+'番のカード');
   if(c.taken&&!v.reveal?.positions.includes(i))b.classList.add('taken');
   if(c.card){b.classList.add('face');if(c.card.suit===1||c.card.suit===2)b.classList.add('red');const mark=document.createElement('span');mark.textContent=suits[c.card.suit];const num=document.createElement('b');num.textContent=c.card.rank===1?'A':String(c.card.rank);b.append(mark,num);}
   else b.textContent='♠';
   b.disabled=v.phase!=='playing'||v.turn!==mine||v.locked||c.taken||v.flipped.includes(i);
   b.onclick=()=>send('flip',{pos:i});
   board.appendChild(b);
 });
}
</script></body></html>
