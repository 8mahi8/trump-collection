<title>トランプコレクション 4人オンライン対戦・Firebase開発版</title><style>

</style></head><body><main>
<h1>🃏 トランプコレクション｜4人オンライン研究版</h1>
<small>開発用のFirebase4人対戦ページ。<strong>Firebase接続先が未設定の間は部屋を作成できません。</strong> 学校のGoogle Sites版・公開版は変更せず、実機試験前の開発用として使います。ページを再読み込みした場合は、新しい部屋を作り直してください。</small>
<div id="connectPanel" class="panel"><select id="game"><option value="babanuki">ババ抜き</option><option value="shichinarabe">七並べ</option><option value="daifugo">大富豪</option></select>
<button id="create">部屋を作る</button><input id="code" placeholder="5桁番号" maxlength="5" inputmode="numeric"><button id="join">参加</button>
<div id="status" role="status">ゲームを選んで部屋作成、友達は5桁の番号で参加</div></div>
<div id="lobby" class="panel" hidden><div id="notice" role="status"></div><div>部屋 <span id="roomCode"></span> <span id="role"></span> <span id="roster"></span></div>
<button id="ready">準備する</button><button id="start">全員準備OK → 開始</button><button id="rematch">再戦</button><button id="leave">退出・部屋を作り直す</button><button id="chatToggle" type="button" aria-expanded="false">💬 チャット</button></div>
<div id="match" class="panel" hidden><div id="state" class="mini"></div><div id="board"></div><div id="hand"></div><div id="actions"></div></div>
</main>
<section id="chatPanel" aria-label="ルーム内チャット" hidden>
 <div style="display:flex;justify-content:space-between;align-items:center"><strong>💬 ルーム内チャット</strong><button id="chatClose" type="button">閉じる</button></div>
 <div id="chatList" role="log" aria-live="polite" aria-relevant="additions text"></div>
 <form id="chatCompose"><input id="chatInput" maxlength="120" autocomplete="off" aria-label="チャットメッセージ" placeholder="メッセージ（120文字まで）"><button id="chatSend" type="submit">送信</button></form>
 <div id="chatStatus" role="status"></div>
</section><script type="module">
import {createFirebaseAnonymousAuth,createFirebaseOpenRootTrialIdentity,createFirebaseRoomStore} from './firebase-room-store.mjs';
import {validateFirebaseConfig} from './firebase-dedicated-guard.mjs';
import {nextFirebasePollDelay} from './firebase-poll-policy.mjs';
import {createFirebaseRoomHost,createFirebaseRoomGuest} from './firebase-room-controller.mjs';

// PUBLIC Firebase Web API key and RTDB URL only. Do not put admin credentials here.
// For isolated tests this object may be set before the module executes.
const CONFIG=window.TRUMP_FIREBASE_CONFIG||{apiKey:'',databaseURL:''};
const OPEN_ROOT_TRIAL=window.TRUMP_FIREBASE_OPEN_ROOT_TRIAL===true;
// Only the previously owner-confirmed open Realtime Database may use a
// temporary unsigned ID. All other environments keep Firebase Anonymous Auth.
const OPEN_ROOT_PROJECT='mygame-df915';
const OPEN_ROOT_DB='https://mygame-df915-default-rtdb.firebaseio.com';
if(OPEN_ROOT_TRIAL){
 document.querySelector('main > small').textContent=
  '友達との試遊専用：現在のFirebaseルールでは誰でもルーム・手札・チャットを読み書きできます。個人情報は送らないでください。ルールの期限は11月8日です。';
}else if(CONFIG.apiKey&&CONFIG.databaseURL){
 document.querySelector('main > small').textContent=
  '4人オンライン対戦。友達の5桁ルーム番号で参加できます。更新したら新しい部屋を作り直してください。';
}
const $=id=>document.getElementById(id);
const UI_SUITS=['♠','♥','♦','♣'];
const CARD_NAMES={1:'A',11:'J',12:'Q',13:'K'};
const GAMES={babanuki:'ババ抜き',shichinarabe:'七並べ',daifugo:'大富豪'};
// Launcher-selected game must survive sandboxed Google Sites/nested srcdoc.
const INITIAL_GAME=window.TRUMP_INITIAL_GAME;
if(Object.prototype.hasOwnProperty.call(GAMES,INITIAL_GAME)){
 $('game').value=INITIAL_GAME;
 $('game').hidden=true; // Already selected in the parent menu.
}
const randomRoom=()=>{const u=new Uint32Array(1);crypto.getRandomValues(u);return String(10000+u[0]%90000)};
const randomAction=()=>{const u=new Uint32Array(2);crypto.getRandomValues(u);return [...u].map(n=>n.toString(36)).join('-')};
const uiCardId=c=>c?.joker?'JK':c.suit+'-'+c.rank;
const cardText=c=>c?.joker?'JOKER':UI_SUITS[c.suit]+(CARD_NAMES[c.rank]||c.rank);
let session=0,auth=null,store=null,hostRunner=null,guestRunner=null;
let roomCode='',game='',mySeat=-1,isHost=false,publicState=null,privateState=null;
let busy=false,pendingAction='',failCount=0,selected=new Set(),lastRender='',online=true;
let tickTimer=null,pollWorking=false,lastPollStatus='waiting_for_host';
let chatOpen=false,chatSending=false,chatLoading=false,chatLastPoll=0,chatSeq=0;
const stateName=()=>isHost?'host':guestRunner?'guest':'menu';

function status(message){$('status').textContent=message;}
function setupInfo(message){$('notice').textContent=message;}
function clear(){
 session++;clearTimeout(tickTimer);tickTimer=null;
 chatOpen=false;chatLoading=false;chatSending=false;chatLastPoll=0;chatSeq=0;
 $('chatPanel').hidden=true;$('chatToggle').setAttribute('aria-expanded','false');
 $('chatList').replaceChildren();$('chatInput').value='';$('chatStatus').textContent='';
 hostRunner=guestRunner=null;roomCode='';publicState=privateState=null;
 mySeat=-1;isHost=false;busy=false;pendingAction='';failCount=0;lastPollStatus='waiting_for_host';selected.clear();lastRender='';
 document.body.classList.remove('in-match');
 $('lobby').hidden=true;$('match').hidden=true;
 $('create').disabled=false;$('join').disabled=false;$('game').disabled=false;
}
async function leaveRoom(){
 const epoch=session, runner=guestRunner, owner=hostRunner, previousHost=isHost;
 if(!runner){clear();return;}
 $('leave').disabled=true;
 try{
  if(previousHost)await owner.closeRoom('host_left');
  else await runner.leaveRoom();
  if(epoch!==session)return;
  clear();
  status('部屋を退出しました。新しい部屋を作って遊べます');
 }catch(err){
  if(epoch!==session)return;
  // Local exit always remains possible even with network failure.
  clear();
  status('部屋から離れました（終了通知は送れませんでした）：'+describe(err));
 }
}
function shouldRun(epoch){return epoch===session&&!!guestRunner;}
async function connectAuth(){
 if(!CONFIG.databaseURL||(!OPEN_ROOT_TRIAL&&!CONFIG.apiKey))throw Error('FIREBASE_CONFIG_MISSING');
 // The emulator injects a fake transport. Real network access requires
 // a known Firebase project and exactly matching DB (including the existing school Firebase).
 const emulatorTransport=Boolean(window.TRUMP_FIREBASE_TEST_FETCH);
 if(emulatorTransport&&!['127.0.0.1','localhost'].includes(location.hostname))
   throw Error('FIREBASE_TEST_TRANSPORT_FORBIDDEN');
 if(OPEN_ROOT_TRIAL){
  // Opt-in test mode only; never bypass the host/project check.
  if(CONFIG.projectId!==OPEN_ROOT_PROJECT||
    new URL(CONFIG.databaseURL).origin!==OPEN_ROOT_DB||
    Object.keys(CONFIG).some(k=>!['projectId','databaseURL'].includes(k)))
    throw Error('TRIAL_PROJECT_MISMATCH');
 }else if(!emulatorTransport)validateFirebaseConfig(CONFIG);
 if(!auth){
  if(OPEN_ROOT_TRIAL){
   auth=createFirebaseOpenRootTrialIdentity();
  }else{
   const opts={apiKey:CONFIG.apiKey};
   // Only used by local CI pages, never on GitHub Pages.
   if(window.TRUMP_FIREBASE_TEST_FETCH)opts.fetchImpl=window.TRUMP_FIREBASE_TEST_FETCH;
   auth=createFirebaseAnonymousAuth(opts);
  }
  await auth.signIn();
 }
 if(!store){
  const opts={databaseURL:CONFIG.databaseURL,auth};
  if(window.TRUMP_FIREBASE_TEST_FETCH)opts.fetchImpl=window.TRUMP_FIREBASE_TEST_FETCH;
  store=createFirebaseRoomStore(opts);
 }
 return store;
}
async function startRoom(asHost){
 if(busy)return;
 busy=true;const epoch=++session;
 $('create').disabled=$('join').disabled=true;
 const choice=$('game').value;
 try{
  await connectAuth();
  if(epoch!==session)return;
  isHost=asHost;
  if(asHost){
   game=choice;
   for(let tries=0;tries<8;tries++){
    roomCode=randomRoom();
    const candidate=createFirebaseRoomHost({store,roomCode,game});
    try{await candidate.bootstrap();hostRunner=candidate;break;}
    catch(e){
     if(e.code==='ALREADY_EXISTS'||e.code==='PERMISSION_DENIED')continue;
     throw e;
    }
   }
   if(!hostRunner)throw Error('ROOM_CODE_COLLISION');
  }else{
   const input=$('code').value.trim();
   if(!/^[0-9]{5}$/.test(input))throw Error('ROOM_CODE_REQUIRED');
   roomCode=input;
   const meta=await store.meta(roomCode);
   if(!meta||meta.protocol!==2||!GAMES[meta.game])throw Error('ROOM_NOT_FOUND');
   game=meta.game;
  }
  if(epoch!==session)return;
  guestRunner=createFirebaseRoomGuest({store,roomCode,game,actionIdSource:randomAction});
  if(!asHost)await guestRunner.requestJoin();
  if(epoch!==session)return;
  $('game').value=game;$('game').disabled=true;
  $('lobby').hidden=false;
  $('create').disabled=$('join').disabled=true;
  busy=false;
  status(asHost?'ルーム作成成功。友達の参加を待っています':'入室申請中。ホストの承認を待っています');
  schedule(epoch,10);
 }catch(err){
  if(epoch!==session)return;
  busy=false;status('接続できません：'+describe(err));
  clear(); // preserves status message
 }
}
function describe(e){
 const key=e?.code||e?.message||String(e);
 return ({
  FIREBASE_CONFIG_MISSING:'Firebase接続先が未設定（開発用画面）',
  TRIAL_PROJECT_MISMATCH:'試遊用のFirebase接続先が一致しません',
  FIREBASE_PROJECT_NOT_ALLOWED:'トランプ用または確認済みの既存Firebaseプロジェクトを指定してください',
  FIREBASE_PROJECT_DATABASE_MISMATCH:'Firebaseプロジェクト名とDBアドレスが一致しません',
  FIREBASE_TEST_TRANSPORT_FORBIDDEN:'テスト用の通信設定はローカルの検証環境でのみ使用可能です',
  UNEXPECTED_FIREBASE_CONFIG_FIELD:'接続設定に許可されていない項目があります',
  ROOM_CODE_REQUIRED:'5桁の番号を入力してね',ROOM_NOT_FOUND:'ルームが見つかりません',
  ROOM_CODE_COLLISION:'部屋番号が混雑しています。もう一度作成',
  PERMISSION_DENIED:'通信権限がありません。認証・DBルールを確認',
  NETWORK_ERROR:'ネットワーク通信に失敗',
  FIREBASE_AUTH_REJECTED:'匿名認証が許可されていません',
  NO_SYNCED_VIEW:'最新の状態を同期中'
 })[key]||key;
}
function schedule(epoch,delay){
 if(!shouldRun(epoch))return;
 clearTimeout(tickTimer);
 tickTimer=setTimeout(()=>poll(epoch),delay);
}
async function poll(epoch){
 if(!shouldRun(epoch)||pollWorking)return;
 pollWorking=true;
 try{
  if(isHost){
   const hostResult=await hostRunner.tick();
   if(hostResult.closed){
    clear();status('参加者が退出したため対戦は終了しました。新しい部屋を作れます');
    return;
   }
  }
  if(!shouldRun(epoch))return;
  const result=await guestRunner.poll();
  if(!shouldRun(epoch))return;
  if(result.status==='room_closed'){
   clear();
   status(result.reason==='player_left'?
    '参加者が退出したので対戦を終了しました。部屋を作り直せます':
    'ホストが部屋を終了しました。新しい部屋を作れます');
   return;
  }
  if(result.status==='ready'){
   lastPollStatus='ready';
   publicState=result.publicView;privateState=result.privateView;
   mySeat=privateState.seat;
   const resumed=!online;
   failCount=0;online=true;
   if(resumed&&!pendingAction)status('通信が復旧したよ');
   if(pendingAction){
    const receipt=await guestRunner.receipt(pendingAction);
    if(!shouldRun(epoch))return;
    if(receipt){
     pendingAction='';busy=false;
     if(receipt.ok)status('操作を反映したよ');
     else status('その操作は受け付けられません：'+receipt.reason);
    }
   }
   render();
   if(chatOpen&&Date.now()-chatLastPoll>2500)void refreshChat();
  }else{
   online=false;lastPollStatus=result.status;
   status(result.status==='waiting_for_host'?'ホストの入室承認を待っています…':
    result.status==='host_unavailable'?'ホストの応答が止まっています。復帰するまで操作を停止します…':
    '状態を同期しています…');
   render();
  }
 }catch(e){
  if(!shouldRun(epoch))return;
  online=false;lastPollStatus='error';failCount++;
  status('通信を再確認しています ('+failCount+')：'+describe(e));
  render();
 }finally{
  pollWorking=false;
  if(shouldRun(epoch))schedule(epoch,nextFirebasePollDelay({
   phase:publicState?.phase,isHost,pendingAction:Boolean(pendingAction),
   status:lastPollStatus,failCount,myTurn:publicState?.turn===mySeat
  }));
 }
}
async function send(type,extra={}){
 if(busy||pendingAction||!online||!guestRunner?.snapshot)return;
 const epoch=session;
 busy=true;render();
 try{
  // Refresh just before sending to avoid stale revision when another seat acts.
  const fresh=await guestRunner.poll();
  if(epoch!==session)return;
  if(fresh.status!=='ready')throw Error('NO_SYNCED_VIEW');
  publicState=fresh.publicView;privateState=fresh.privateView;mySeat=privateState.seat;
  const id=await guestRunner.act(type,extra);
  if(epoch!==session)return;
  pendingAction=id;
  status('操作を送信しました…');
  render();
  schedule(epoch,25);
 }catch(err){
  if(epoch!==session)return;
  busy=false;status('操作を送れません：'+describe(err));render();
 }
}
function setChatOpen(open){
 chatOpen=Boolean(open);
 $('chatPanel').hidden=!chatOpen;
 $('chatToggle').setAttribute('aria-expanded',String(chatOpen));
 if(chatOpen){chatLastPoll=0;void refreshChat();$('chatInput').focus();}
}
async function refreshChat(){
 if(!chatOpen||chatLoading||!store||!roomCode||mySeat<0)return;
 const epoch=session,room=roomCode;
 chatLoading=true;chatLastPoll=Date.now();
 try{
  const raw=await store.chat(room)||{};
  if(epoch!==session||!chatOpen||room!==roomCode)return;
  const entries=[];
  for(const [author,slots] of Object.entries(raw)){
   if(!slots||typeof slots!=='object')continue;
   for(const m of Object.values(slots)){
    if(!m||m.uid!==author||typeof m.text!=='string'||
       !Number.isSafeInteger(m.seq)||!Number.isFinite(m.sentAt))continue;
    entries.push(m);
   }
  }
  entries.sort((a,b)=>a.sentAt-b.sentAt||a.uid.localeCompare(b.uid)||a.seq-b.seq);
  const log=$('chatList'),bottom=log.scrollHeight-log.scrollTop-log.clientHeight<28;
  log.replaceChildren();
  for(const m of entries.slice(-40)){
   const line=document.createElement('div');line.className='chat-msg';
   const author=document.createElement('span');author.className='chat-name';
   author.textContent=m.uid===store.uid?'自分':'友達 '+m.uid.slice(-3);
   const content=document.createElement('span');content.textContent=m.text;
   line.append(author,content);log.appendChild(line);
  }
  if(bottom)log.scrollTop=log.scrollHeight;
  $('chatStatus').textContent='';
 }catch(e){
  if(epoch===session&&chatOpen)$('chatStatus').textContent='チャットを取得できません：'+describe(e);
 }finally{chatLoading=false;}
}
async function sendChat(event){
 event.preventDefault();
 const text=$('chatInput').value.trim();
 if(!text||text.length>120||chatSending||!store||!roomCode||mySeat<0)return;
 if(!online){$('chatStatus').textContent='通信の復帰を待っています';return;}
 const epoch=session,room=roomCode;
 chatSending=true;$('chatSend').disabled=true;
 try{
  await store.sendChat(room,text,++chatSeq);
  if(epoch!==session||room!==roomCode)return;
  $('chatInput').value='';chatLastPoll=0;
  await refreshChat();
 }catch(e){
  if(epoch===session)$('chatStatus').textContent='送信できません：'+describe(e);
 }finally{chatSending=false;$('chatSend').disabled=false;}
}
$('chatToggle').onclick=()=>setChatOpen(!chatOpen);
$('chatClose').onclick=()=>setChatOpen(false);
$('chatCompose').onsubmit=sendChat;
function appendText(parent,text,className=''){
 const item=document.createElement('span');item.textContent=text;if(className)item.className=className;parent.appendChild(item);return item;
}
function button(text,fn,disabled=false,cls=''){
 const b=document.createElement('button');b.type='button';b.textContent=text;b.disabled=disabled;
 if(cls)b.className=cls;if(fn)b.onclick=fn;
 return b;
}
function card(c,clickable=false,click=null){
 const b=button(cardText(c),click,!clickable,'card'+((c?.suit===1||c?.suit===2)?' red':''));
 return b;
}
function render(){
 if(!publicState){
  document.body.classList.remove('in-match');
  $('ready').disabled=$('start').disabled=true;
  return;
 }
 const v=publicState,p=mySeat,acting=v.phase==='playing'&&v.turn===p;
 document.body.classList.toggle('in-match',v.phase==='playing'||v.phase==='finished');
 const key=[v.round,v.revision,p,busy,pendingAction,online,[...selected].sort().join(',')].join('|');
 if(key===lastRender)return;lastRender=key;
 const usable=online&&!busy&&!pendingAction&&p>=0;
 $('roomCode').textContent=roomCode;
 $('role').textContent='｜'+(isHost?'ホスト':'ゲスト')+' / '+(p>=0?'席 '+(p+1):'入室待ち');
 $('roster').textContent='｜'+v.seats.filter(s=>s.present).length+'/4人';
 $('ready').disabled=!usable||v.phase!=='lobby';
 $('ready').textContent=v.seats[p]?.ready?'準備を解除':'準備OK';
 $('start').hidden=!isHost;
 $('start').disabled=!usable||v.phase!=='lobby'||!v.seats.every(s=>s.ready);
 $('rematch').hidden=!isHost||v.phase!=='finished';
 $('rematch').disabled=!usable;
 $('match').hidden=v.phase==='lobby';
 $('match').dataset.game=game;
 const state=$('state'),board=$('board'),hand=$('hand'),actions=$('actions');
 board.replaceChildren();hand.replaceChildren();actions.replaceChildren();
 state.textContent=GAMES[game]+'｜'+(v.phase==='finished'?'結果':acting?'あなたの番':'相手の番')+
  '｜手札 '+(v.counts||[]).join(' / ')+'｜通信 '+(online?'OK':'再接続中');
 setupInfo(v.phase==='lobby'?'4人が準備したらホストが開始します':v.phase==='finished'?'対戦終了！ 再戦できます':acting?'カードを選んで操作してね':'相手の操作を待っています');
 if(v.phase==='finished'){
  appendText(actions,'順位： '+Object.entries(v.ranks||{}).sort((a,b)=>a[1]-b[1]).map(([seat,r])=>(Number(seat)===p?'自分':'席'+(Number(seat)+1))+' '+r+'位').join(' / '));
 }
 if(v.phase!=='playing'&&v.phase!=='finished')return;
 if(game==='babanuki'){
  appendText(board,'引く相手：席'+(Number(v.drawFrom)+1)+'　','mini');
  if(acting&&usable&&v.drawFrom!==p&&v.counts[v.drawFrom]>0){
   for(let i=0;i<v.counts[v.drawFrom];i++)board.appendChild(button('🂠',()=>send('draw',{index:i}),false,'card back'));
  }else appendText(board,acting?'操作待ち':'相手の手番です','muted');
  if(privateState?.lastDraw?.card)appendText(board,' 引いた：'+cardText(privateState.lastDraw.card)+(privateState.lastDraw.paired?'（ペア成立）':''));
 }else if(game==='shichinarabe'){
  const placed=v.placed||[];
  for(let suit=0;suit<4;suit++){
   const line=document.createElement('div');line.className='board-line';
   appendText(line,UI_SUITS[suit]+' ','mini');
   for(let rank=1;rank<=13;rank++){
    const inField=placed[suit]&&rank>=placed[suit].low&&rank<=placed[suit].high;
    appendText(line,inField?(CARD_NAMES[rank]||rank)+'':'·',inField?'field-card':'field-empty');
   }
   board.appendChild(line);
  }
  // Like COM mode, selecting a card must never send it immediately.
  // Requiring an explicit confirmation avoids accidental touches on iPad.
  const pick=[...selected][0];
  const canConfirm=selected.size===1&&(privateState?.legalIds||[]).includes(pick);
  actions.appendChild(button('選択カードを出す',()=>{
   const id=[...selected][0];selected.clear();
   send('play',{id});
  },!usable||!acting||!canConfirm));
  appendText(actions,canConfirm?' 選択したカードを確定できます':' 出したいカードを選んでね','mini');
  actions.appendChild(button('パス',()=>{selected.clear();send('pass');},!usable||!acting));
 }else if(game==='daifugo'){
  appendText(board,'場：'+(v.field?.cards?.map(cardText).join(' / ')||'なし')+(v.revolution?' ｜革命中！':''),'');
  actions.appendChild(button('パス',()=>send('pass'),!usable||!acting||!v.field));
  const choices=(privateState?.legalMoves||[]).filter(m=>m.every(id=>selected.has(id))&&m.length===selected.size);
  const legal=choices.length>0;
  actions.appendChild(button('選択カードを出す（'+selected.size+'枚）',()=>{const ids=[...selected];selected.clear();send('play',{ids});},!usable||!acting||!legal));
  appendText(actions,legal?' 出せる組み合わせ':' 手札を選択してね','mini');
 }
 const cards=Array.isArray(privateState?.hand)?privateState.hand:[];
 appendText(hand,'あなたの手札（'+cards.length+'枚）','mini');
 const row=document.createElement('div');row.className='hand-cards';
 for(const c of cards){
  const id=uiCardId(c),canPlay=usable&&acting&&
    (game==='shichinarabe'&&(privateState?.legalIds||[]).includes(id)||game==='daifugo');
  const b=card(c,canPlay,canPlay?()=>{
   if(game==='shichinarabe'){
    // Seven: a single selected card, confirm with the action button.
    selected.has(id)?selected.clear():(selected.clear(),selected.add(id));
    lastRender='';render();
   }else {selected.has(id)?selected.delete(id):selected.add(id);lastRender='';render();}
  }:null);
  if(selected.has(id))b.classList.add('selected');
  row.appendChild(b);
 }
 hand.appendChild(row);
}
$('create').onclick=()=>startRoom(true);
$('join').onclick=()=>startRoom(false);
$('ready').onclick=()=>send('ready',{ready:!publicState.seats[mySeat].ready});
$('start').onclick=()=>send('start');
$('rematch').onclick=()=>{selected.clear();send('rematch');};
$('leave').onclick=()=>leaveRoom();
// Google Sites collection launcher can be in a sandboxed parent iframe.
// postMessage still works even when direct child DOM access is forbidden.
window.addEventListener('message',async event=>{
 if(event.source!==window.parent||event.data?.type!=='tc:leave-room')return;
 const requestId=event.data.requestId;
 if(typeof requestId!=='string'||!/^back-[0-9]{1,12}$/.test(requestId))return;
 try{await leaveRoom();}
 finally{
  window.parent.postMessage({type:'tc:leave-ack',requestId},'*');
 }
});
window.addEventListener('pagehide',()=>{session++;clearTimeout(tickTimer);});
window.TCFourRemote={get phase(){return publicState?.phase},get view(){return publicState},
 get privateView(){return privateState},get seat(){return mySeat},get role(){return stateName()},
 get status(){return $('status').textContent},create:()=>startRoom(true),join:()=>startRoom(false),
 command:send,leave:leaveRoom,stop:clear};
</script></body></html>
