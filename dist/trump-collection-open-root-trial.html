{ min-width:70px; padding:3px 5px; } .opp .face { font-size:18px; } #handArea { padding-top:0; } #topbar { padding-top:2px; padding-bottom:2px; } #handLabel { display:none; } .fieldcards .card.small { width:calc(var(--cw) * 0.6); height:calc(var(--cw) * 0.87); } #actions { margin-top:4px; min-height:40px; } .abtn { padding:9px 22px; } }\n/* v1.5.1: 短い横画面・Google Sites iframeの操作領域を確保 */\n@media (max-height: 500px) {\n  :root { --cw:44px; }\n  #topbar { min-height:44px; padding:0 7px; gap:6px; }\n  #topbar .gtitle { font-size:14px; }\n  #topbar button { padding:4px 9px; }\n  #opponents { padding:0 5px; gap:2px; }\n  .opp { min-width:60px; padding:1px 3px; border-width:1px; line-height:1.15; }\n  .opp .face { display:none; }\n  .opp .nm { font-size:11px; }\n  .opp .cnt { font-size:10px; }\n  #center { padding:2px 4px; }\n  #handArea { padding:0 4px 3px; }\n  #hand { min-height:66px; }\n  #selInfo { min-height:16px; margin-top:1px; font-size:11px; }\n  #actions { min-height:44px; margin-top:2px; gap:6px; }\n  .abtn { font-size:13px; padding:5px 12px; min-height:44px; }\n  #hand .card.sel { transform:translateY(-24px) scale(1.04); }\n  .selbadge { top:-7px; width:18px; height:18px; font-size:11px; }\n  #rows { gap:2px; }\n  .srow { gap:1px; }\n  .srow .slabel { width:20px; font-size:15px; }\n  #rows .slot, #rows .card.tiny { width:30px; height:27px; border-radius:4px; font-size:10px; }\n  #rows .card.tiny .tl { left:2px; top:2px; font-size:9px; }\n  #rows .card.tiny .big { font-size:1.15em; }\n}\n@media (max-height: 365px) {\n  :root { --cw:38px; }\n  #hand { min-height:57px; }\n  #rows .slot, #rows .card.tiny { width:27px; height:23px; }\n  #rows .card.tiny .tl { font-size:8px; }\n  .opp { padding:0 3px; }\n}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv id=\"app\">\n  \u003cdiv id=\"menuScreen\">\n    \u003cspan class=\"floatsuit\" style=\"left:6%; top:12%\">♠\u003c/span>\u003cspan class=\"floatsuit\" style=\"right:8%; top:20%; animation-delay:-2s\">♥\u003c/span>\u003cspan class=\"floatsuit\" style=\"left:12%; bottom:10%; animation-delay:-4s\">♦\u003c/span>\u003cspan class=\"floatsuit\" style=\"right:14%; bottom:14%; animation-delay:-1s\">♣\u003c/span>\n    \u003ch1>🃏 トランプコレクション\u003c/h1>\n    \u003cdiv class=\"sub\">学校のiPadでも遊べる、定番トランプゲーム集。COMと対戦できます。\u003c/div>\n    \u003cdiv class=\"tiles\">\n      \u003cbutton class=\"tile\" data-game=\"babanuki\">\u003cdiv class=\"emo\">🃏\u003c/div>\u003ch2>ババ抜き\u003c/h2>\u003cp>となりの人のカードを引いて、ペアを捨てよう。最後にジョーカーを持っていた人が負け。\u003c/p>\u003cdiv class=\"meta\">4人（あなた＋COM×3）\u003c/div>\u003c/button>\n      \u003cbutton class=\"tile\" data-game=\"shichinarabe\">\u003cdiv class=\"emo\">7️⃣\u003c/div>\u003ch2>七並べ\u003c/h2>\u003cp>7の横にカードを並べていく定番ゲーム。パスは3回まで、4回で脱落！\u003c/p>\u003cdiv class=\"meta\">4人（あなた＋COM×3）\u003c/div>\u003c/button>\n      \u003cbutton class=\"tile\" data-game=\"shinkei\">\u003cdiv class=\"emo\">🧠\u003c/div>\u003ch2>神経衰弱\u003c/h2>\u003cp>24枚のカードの場所を覚えてペアを取ろう。COMの記憶力は3段階。\u003c/p>\u003cdiv class=\"meta\">2人（あなた vs COM）・難易度つき\u003c/div>\u003c/button>\n      \u003cbutton class=\"tile\" data-game=\"daifugo\">\u003cdiv class=\"emo\">👑\u003c/div>\u003ch2>大富豪\u003c/h2>\u003cp>8切り・革命・縛り・スペ3返しなどローカルルール対応。貧民から大富豪を目指せ！\u003c/p>\u003cdiv class=\"meta\">4人（あなた＋COM×3）・ルール設定つき\u003c/div>\u003c/button>\n    \u003c/div>\n    \u003cp class=\"note\" style=\"color:#9fc7ab; margin-top:16px;\">遊び方：ゲームを選ぶだけ。あとは画面の指示どおりにタップしてください。\u003c/p>\n    \u003cp id=\"verLabel\" style=\"color:#7fae8d; font-size:11px; margin-top:6px;\">\u003c/p>\n  \u003c/div>\n\n  \u003cdiv id=\"gameScreen\" class=\"hidden\">\n    \u003cdiv id=\"topbar\">\n      \u003cbutton id=\"backBtn\">← メニュー\u003c/button>\n      \u003cspan class=\"gtitle\" id=\"gameTitle\">\u003c/span>\n      \u003cspan id=\"message\">\u003c/span>\n      \u003cbutton id=\"restartBtn\">最初から\u003c/button>\n    \u003c/div>\n    \u003cdiv id=\"opponents\">\u003c/div>\n    \u003cdiv id=\"center\">\u003c/div>\n    \u003cdiv id=\"handArea\">\n      \u003cdiv id=\"handLabel\">\u003c/div>\n      \u003cdiv id=\"hand\">\u003c/div>\n      \u003cdiv id=\"selInfo\">\u003c/div>\n      \u003cdiv id=\"actions\">\u003c/div>\n    \u003c/div>\n  \u003c/div>\n  \u003cdiv id=\"banner\">\u003c/div>\n  \u003cdiv id=\"modalRoot\">\u003c/div>\n\u003c/div>\n\u003cscript>// トランプゲーム集 共通ロジック＋4ゲーム＋BOT（描画なし・Nodeでも動作）\nfunction mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nconst SUITS = ['♠', '♥', '♦', '♣'];\nconst SUIT_NAMES = ['スペード', 'ハート', 'ダイヤ', 'クラブ'];\nfunction cardId(c) { return c.joker ? 'JK' : c.suit + '-' + c.rank; }\nfunction makeDeck(jokers = 0) { const d = []; for (let s = 0; s \u003c 4; s++) for (let r = 1; r \u003c= 13; r++) d.push({ suit: s, rank: r }); for (let i = 0; i \u003c jokers; i++) d.push({ joker: true }); return d; }\nfunction shuffle(deck, rng) { const d = deck.slice(); for (let i = d.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0;[d[i], d[j]] = [d[j], d[i]]; } return d; }\nfunction sortHand(hand) { return hand.slice().sort((a, b) => (a.joker ? 99 : a.suit * 100 + a.rank) - (b.joker ? 99 : b.suit * 100 + b.rank)); }\nfunction removePairs(hand) { // ババ抜き用: 同じ数字のペアを取り除く\n  const byRank = new Map(); const rest = [];\n  for (const c of hand) { if (c.joker) { rest.push(c); continue; } if (!byRank.has(c.rank)) byRank.set(c.rank, []); byRank.get(c.rank).push(c); }\n  const pairs = [];\n  for (const [, cs] of byRank) { const n = cs.length - (cs.length % 2); for (let i = 0; i \u003c n; i++) pairs.push(cs[i]); for (let i = n; i \u003c cs.length; i++) rest.push(cs[i]); }\n  return { hand: rest, pairs };\n}\n\n// ============ ババ抜き ============\nfunction createBabanuki(seed, players = 4) {\n  const rng = mulberry32(seed);\n  const deck = shuffle(makeDeck(1), rng);\n  const hands = Array.from({ length: players }, () => []);\n  deck.forEach((c, i) => hands[i % players].push(c));\n  const st = { game: 'babanuki', hands: hands.map(h => removePairs(h).hand), turn: 0, ranks: {}, finishedOrder: [], phase: 'play', loser: -1, lastDraw: null };\n  st.hands.forEach((h, i) => { if (h.length === 0) { st.ranks[i] = Object.keys(st.ranks).length + 1; st.finishedOrder.push(i); } });\n  while (st.hands[st.turn].length === 0) st.turn = (st.turn + 1) % players;\n  return st;\n}\nfunction babanukiNextWithCards(st, from) { let n = from; do { n = (n + 1) % st.hands.length; } while (st.hands[n].length === 0 && n !== from); return n; }\nfunction babanukiDraw(st, cardIndex) {\n  if (st.phase !== 'play') return st;\n  const me = st.turn, target = babanukiNextWithCards(st, me);\n  if (target === me) { st.phase = 'end'; return st; }\n  if (!Number.isInteger(cardIndex) || cardIndex \u003c 0 || cardIndex >= st.hands[target].length) return st;\n  const card = st.hands[target].splice(cardIndex, 1)[0];\n  st.hands[me].push(card);\n  st.lastDraw = { from: target, by: me, card };\n  const before = st.hands[me].length;\n  st.hands[me] = removePairs(st.hands[me]).hand;\n  const paired = st.hands[me].length \u003c before;\n  st.lastDraw.paired = paired;\n  for (const p of [target, me]) if (st.hands[p].length === 0 && st.ranks[p] === undefined) { st.ranks[p] = Object.keys(st.ranks).length + 1; st.finishedOrder.push(p); }\n  const alive = st.hands.map((h, i) => ({ h, i })).filter(o => o.h.length > 0);\n  if (alive.length \u003c= 1) { st.phase = 'end'; st.loser = alive.length ? alive[0].i : -1; if (st.loser >= 0) st.ranks[st.loser] = st.hands.length; return st; }\n  st.turn = babanukiNextWithCards(st, me);\n  return st;\n}\nfunction botBabanuki(st) { const target = babanukiNextWithCards(st, st.turn); return (Math.random() * st.hands[target].length) | 0; }\n\n// ============ 七並べ ============\nfunction createShichinarabe(seed, players = 4) {\n  const rng = mulberry32(seed);\n  const deck = shuffle(makeDeck(0), rng);\n  const hands = Array.from({ length: players }, () => []);\n  deck.forEach((c, i) => hands[i % players].push(c));\n  const st = { game: 'shichinarabe', hands, placed: [null, null, null, null].map(() => ({ low: 8, high: 6 })), pending: [], turn: 0, passes: Array(players).fill(0), ranks: {}, out: Array(players).fill(false), phase: 'play', lastAction: null };\n  // 7を最初から場に出す\n  st.hands.forEach((h, p) => { st.hands[p] = h.filter(c => { if (c.rank === 7) { st.placed[c.suit] = { low: 7, high: 7 }; return false; } return true; }); });\n  const d3 = st.hands.findIndex(h => h.some(c => c.suit === 2 && c.rank === 3));\n  st.turn = d3 >= 0 ? d3 : 0;\n  shichinarabeAutoPlace(st);\n  return st;\n}\nfunction shichinarabeAutoPlace(st) { // pending（脱落者のカード）が隣接したら自動で並べる\n  let moved = true;\n  while (moved) { moved = false; st.pending = st.pending.filter(c => { const pl = st.placed[c.suit]; if (c.rank === pl.low - 1) { pl.low = c.rank; moved = true; return false; } if (c.rank === pl.high + 1) { pl.high = c.rank; moved = true; return false; } return true; }); }\n}\nfunction shichinarabeLegal(hand, placed) { return hand.filter(c => c.rank === placed[c.suit].low - 1 || c.rank === placed[c.suit].high + 1); }\nfunction shichinarabePlay(st, id) {\n  if (st.phase !== 'play') return st;\n  const p = st.turn, idx = st.hands[p].findIndex(c => cardId(c) === id);\n  if (idx \u003c 0) return st;\n  const c = st.hands[p][idx], pl = st.placed[c.suit];\n  if (!(c.rank === pl.low - 1 || c.rank === pl.high + 1)) return st;\n  st.hands[p].splice(idx, 1);\n  if (c.rank === pl.low - 1) pl.low = c.rank; else pl.high = c.rank;\n  st.lastAction = { player: p, type: 'play', card: c };\n  shichinarabeAutoPlace(st);\n  if (st.hands[p].length === 0 && st.ranks[p] === undefined) { st.ranks[p] = Object.keys(st.ranks).length + 1; }\n  shichinarabeAdvance(st);\n  return st;\n}\nfunction shichinarabePass(st) {\n  if (st.phase !== 'play') return st;\n  const p = st.turn;\n  st.passes[p]++;\n  st.lastAction = { player: p, type: 'pass', count: st.passes[p] };\n  if (st.passes[p] >= 4 && !st.out[p]) { // 4回目のパスで脱落：手札は pending へ\n    st.out[p] = true; st.pending.push(...st.hands[p]); st.hands[p] = [];\n    st.ranks[p] = 99; // 暫定（最後に最下位へ）\n    shichinarabeAutoPlace(st);\n  }\n  shichinarabeAdvance(st);\n  return st;\n}\nfunction shichinarabeAdvance(st) {\n  const total = st.hands.length;\n  const remaining = st.hands.map((h, i) => i).filter(i => !st.out[i] && st.hands[i].length > 0);\n  if (remaining.length \u003c= 1) { st.phase = 'end'; // 順位の正規化: 上がり順 → 最後まで残った人 → 脱落者\n    const order = [];\n    Object.entries(st.ranks).filter(([, v]) => v !== 99).sort((a, b) => a[1] - b[1]).forEach(([k]) => order.push(Number(k)));\n    remaining.forEach(i => { if (!order.includes(i)) order.push(i); });\n    st.hands.forEach((h, i) => { if (st.out[i] && !order.includes(i)) order.push(i); });\n    order.forEach((p, idx) => st.ranks[p] = idx + 1);\n    return;\n  }\n  let n = st.turn;\n  do { n = (n + 1) % total; } while (st.out[n] || st.hands[n].length === 0);\n  st.turn = n;\n}\nfunction botShichinarabe(st) {\n  const p = st.turn, hand = st.hands[p];\n  const legal = shichinarabeLegal(hand, st.placed);\n  if (!legal.length) return { type: 'pass' };\n  // 次の手番でも出せる自分の連番を多く開く。相手の非公開カードは参照しない。\n  const score = c => {\n    const step = c.rank \u003c 7 ? -1 : 1;\n    let chain = 0;\n    for (let rank = c.rank + step; rank >= 1 && rank \u003c= 13; rank += step) {\n      if (hand.some(x => x.suit === c.suit && x.rank === rank)) chain++;\n      else break;\n    }\n    return chain * 10 + hand.filter(x => x.suit === c.suit).length * 0.2;\n  };\n  legal.sort((a, b) => score(b) - score(a));\n  // 意図的なパスは2000試合の比較で成績が悪化したため導入しない。\n  return { type: 'play', id: cardId(legal[0]) };\n}\n\n// ============ 神経衰弱 ============\nfunction createShinkei(seed, difficulty = 1) {\n  const rng = mulberry32(seed);\n  const cards = [];\n  for (let s = 0; s \u003c 4; s++) for (let r = 1; r \u003c= 6; r++) cards.push({ suit: s, rank: r });\n  const board = shuffle(cards, rng).map(c => ({ card: c, taken: false }));\n  return { game: 'shinkei', board, turn: 0, scores: [0, 0], flipped: [], phase: 'play', winner: -1, difficulty, memory: new Map(), lastResult: null, lastPair: null };\n}\nfunction shinkeiObserve(st, pos) { const c = st.board[pos].card; st.memory.set(pos, c.suit + '-' + c.rank); if (st.difficulty === 0 && st.memory.size > 6) { const k = st.memory.keys().next().value; st.memory.delete(k); } if (st.difficulty === 1 && st.memory.size > 14) { const k = st.memory.keys().next().value; st.memory.delete(k); } }\nfunction shinkeiFlip(st, pos) {\n  if (st.phase !== 'play' || !Number.isInteger(pos) || pos \u003c 0 || pos >= st.board.length || st.board[pos].taken || st.flipped.includes(pos) || st.flipped.length >= 2) return st;\n  st.flipped.push(pos); shinkeiObserve(st, pos);\n  if (st.flipped.length === 2) {\n    const [a, b] = st.flipped, ca = st.board[a].card, cb = st.board[b].card;\n    st.lastPair = { positions: [a, b] };\n    if (ca.rank === cb.rank) { st.board[a].taken = st.board[b].taken = true; st.scores[st.turn]++; st.memory.delete(a); st.memory.delete(b); st.lastResult = { match: true, player: st.turn }; st.flipped = []; }\n    else { st.lastResult = { match: false, player: st.turn }; st.flipped = []; st.turn = 1 - st.turn; if (st.difficulty === 0) { /* 弱いCOMは見たカードをよく忘れる */ for (const k of [...st.memory.keys()]) if (Math.random() \u003c 0.4) st.memory.delete(k); } }\n    if (st.board.every(x => x.taken)) { st.phase = 'end'; st.winner = st.scores[0] === st.scores[1] ? -1 : (st.scores[0] > st.scores[1] ? 0 : 1); }\n  }\n  return st;\n}\nfunction botShinkei(st) {\n  // 既知のペアがあれば取る。なければ未知をめくり、既知と合えば取る\n  const known = [...st.memory.entries()].filter(([pos]) => !st.board[pos].taken);\n  if (st.flipped.length === 0) {\n    const byRank = new Map();\n    for (const [pos, key] of known) { const r = key.split('-')[1]; if (!byRank.has(r)) byRank.set(r, []); byRank.get(r).push(pos); }\n    for (const [, ps] of byRank) if (ps.length >= 2) return if (!st.field) {\n    c.innerHTML = `\u003cdiv style=\"text-align:center\">\u003cdiv style=\"color:#ffe9a8; margin-bottom:6px\">${tags.join(' ')} ${st.lastEvent || ''}\u003c/div>\u003cdiv style=\"color:#cfe9d6\">${st.turn === 0 ? '好きなカードを出せるよ（リード）' : NAMES[st.turn] + ' が出す番'}\u003c/div>\u003c/div>`;\n    if (prevFieldCards && st.phase === 'play') { const ghost = document.createElement('div'); ghost.className = 'fieldcards ghost'; prevFieldCards.forEach(cd => ghost.appendChild(cardEl(cd, 'small'))); c.querySelector('div').appendChild(ghost); setTimeout(() => ghost.remove(), 360); }\n  } else {\n    const wrap = document.createElement('div');\n    wrap.style.textAlign = 'center';\n    wrap.innerHTML = `\u003cdiv style=\"color:#ffe9a8; margin-bottom:6px\">${tags.join(' ')}\u003c/div>\u003cdiv class=\"fieldcards\">\u003c/div>\u003cdiv style=\"color:#cfe9d6; margin-top:6px\">${NAMES[st.field.lastPlayer]} が出した（${st.field.count}枚）／${st.lastEvent || ''}\u003c/div>`;\n    const fc = wrap.querySelector('.fieldcards');\n    st.field.cards.forEach(cd => { const e = cardEl(cd, 'small'); e.classList.add('pop'); fc.appendChild(e); });\n    c.innerHTML = ''; c.appendChild(wrap);\n  }\n  prevFieldCards = st.field ? st.field.cards : null;\n  const myTurn = st.turn === 0 && st.phase === 'play';\n  const legal = myTurn ? G.daifugoLegalMoves(st, 0) : [];\n  const legalKeys = new Set(legal.map(m => m.map(G.cardId).sort().join(',')));\n  const legalCardIds = new Set(legal.flat().map(G.cardId));\n  const selCards = st.hands[0].filter(cd => selected.has(G.cardId(cd)));\n  const reason = myTurn ? daifugoSelReason(selCards, legalKeys) : null;\n  const sortedHand = st.hands[0].slice().sort((a, b) => G.rankValue(a) - G.rankValue(b) || (a.joker ? 9 : a.suit) - (b.joker ? 9 : b.suit));\n  $('handLabel').textContent = myTurn ? 'あなたの番' : `${NAMES[st.turn]} の番`;\n  msg(st.revolution ? '革命中！ 弱いカードほど強い' : '');\n  renderHand(sortedHand, {\n    legalIds: myTurn ? legalCardIds : new Set(),\n    dimIds: myTurn ? new Set(st.hands[0].filter(cd => !legalCardIds.has(G.cardId(cd))).map(G.cardId)) : new Set(),\n    groupRanks: true,\n    onTap: cd => { if (!myTurn || busy || !st || st.turn !== 0 || st.phase !== 'play') return; const id = G.cardId(cd); if (!legalCardIds.has(id)) { shakeCard(id); return; } if (selected.has(id)) selected.delete(id); else selected.add(id); render(); }\n  });\n  const info = $('selInfo');\n  if (myTurn) {\n    if (!selCards.length) info.innerHTML = 'カードを選んでね（明るいカードが出せるよ）';\n    else if (reason && reason.ok) { const info2 = G.comboInfo(selCards, st); const extra = []; if (st.cfg.eightCut && info2.has8) extra.push('8切り！'); if (st.cfg.revolution && info2.count >= 4) extra.push(st.revolution ? '革命鎮圧！' : '革命！'); if (st.hands[0].length === selCards.length) extra.push('上がり！'); info.innerHTML = `\u003cspan class=\"ok\">選択中 ${selCards.length}枚：出せる！\u003c/span> ${extra.join(' ')}`; }\n    else info.innerHTML = `\u003cspan class=\"ng\">選択中 ${selCards.length}枚：${reason ? reason.text : ''}\u003c/span>`;\n  } else info.textContent = '';\n  actions(myTurn ? [\n    { label: '出す', disabled: !(reason && reason.ok), onClick: async () => { if (busy || !st || st.turn !== 0 || st.phase !== 'play' || !reason?.ok) return; busy = true; const currentSession = session; const cs = st.hands[0].filter(cd => selected.has(G.cardId(cd))); const els = [...document.querySelectorAll('#hand .card.sel')]; const centerRect = $('center').getBoundingClientRect(); els.forEach((el, i) => flyTo(el, centerRect, cs[i], i * 45)); await sleep(250 + cs.length * 45); if (session !== currentSession) return; selected.clear(); G.daifugoPlay(st, 0, cs); busy = false; checkFx(); render(); if (st.phase === 'end') showResult(); else driveBots(); } },\n    ...(st.field ? [{ label: 'パス', sub: true, onClick: () => { if (busy || !st || st.turn !== 0 || st.phase !== 'play') return; selected.clear(); G.daifugoPass(st, 0); render(); if (st.phase === 'end') showResult(); else driveBots(); } }] : []),\n    ...(selCards.length ? [{ label: 'すべて解除', sub: true, onClick: () => { if (busy || !st || st.turn !== 0 || st.phase !== 'play') return; selected.clear(); render(); } }] : []),\n  ] : []);\n  if (st.phase === 'end') showResult();\n}\n$('verLabel').textContent = 'v' + TC_VERSION;\n// ===== テスト/検証用フック（画面の見た目に依存せず状態と操作を直接扱う） =====\nwindow.TC = {\n  version: TC_VERSION,\n  setFast(on) { botWait = on ? 110 : 780; },\n  get state() { return st; },\n  get game() { return game; },\n  start(g) { startGame(g); const b = $('mStart'); if (b) b.click(); },\n  legal() {\n    if (!st || st.phase !== 'play' || st.turn !== 0) return [];\n    if (game === 'daifugo') return G.daifugoLegalMoves(st, 0).map(m => m.map(G.cardId));\n    if (game === 'shichinarabe') return G.shichinarabeLegal(st.hands[0], st.placed).map(c => [G.cardId(c)]);\n    if (game === 'babanuki') return [['draw']];\n    if (game === 'shinkei') return st.board.map((b, i) => i).filter(i => !st.board[i].taken && !st.flipped.includes(i)).map(i => [i]);\n    return [];\n  },\n  act(a) {\n    if (!st || st.phase !== 'play' || st.turn !== 0) return false;\n    if (game === 'daifugo') {\n      if (a.type === 'pass') { G.daifugoPass(st, 0); }\n      else { const cs = st.hands[0].filter(cd => a.ids.includes(G.cardId(cd))); G.daifugoPlay(st, 0, cs); checkFx(); }\n      render(); if (st.phase === 'end') showResult(); else driveBots(); return true;\n    }\n    if (game === 'shichinarabe') {\n      if (a.type === 'pass') G.shichinarabePass(st); else G.shichinarabePlay(st, a.ids[0]);\n      render(); if (st.phase === 'end') showResult(); else driveBots(); return true;\n    }\n    if (game === 'babanuki') { G.babanukiDraw(st, a.index || 0); render(); if (st.phase === 'end') showResult(); else driveBots(); return true; }\n    if (game === 'shinkei') { shinkeiPlayerFlip(a.pos); return true; }\n    return false;\n  },\n};\nshowMenu();\n\u003c/script>\n\u003cscript>(function comAutoStart(){\n window.addEventListener('message',e=>{\n  if(e.source!==window.parent||e.data?.type!=='tc:launch-com')return;\n  const game=e.data.game;\n  if(!['babanuki','shichinarabe','shinkei','daifugo'].includes(game))return;\n  document.querySelector('[data-game=\"'+game+'\"]')?.click();\n });\n})();\u003c/script>\u003c/body>\n\u003c/html>\n","friends4":"\u003c!doctype html>\u003chtml lang=\"ja\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\n\u003ctitle>トランプコレクション 4人オンライン対戦・Firebase開発版\u003c/title>\u003cstyle>\n*{box-sizing:border-box}html,body{margin:0;font-family:system-ui,sans-serif;background:#123c2c;color:#f6f6ed}\nmain{max-width:920px;margin:0 auto;padding:15px}h1{font-size:22px;margin:0 0 6px}\nsmall{color:#ffe8b3;line-height:1.5}.panel{padding:12px;border-radius:10px;border:1px solid #4e9471;background:#20553d;margin:10px 0}\nbutton,select,input{font:inherit;min-height:42px;border-radius:8px;padding:7px 12px;border:0}\nbutton{background:#ffdf73;color:#17281c;font-weight:700;cursor:pointer;margin:3px}button:disabled{opacity:.4}\nselect,input{background:#fafff5;color:#223128}input{max-width:140px}\n#roomCode{font-size:21px;color:#fff2a6;font-weight:800;letter-spacing:2px}\n#board{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px;align-items:center}\n.card{font-size:16px;border-radius:6px;border:1px solid #cde4cd;background:#fff;color:#222;min-width:52px;height:64px;padding:6px}\n.card.red{color:#b52245}.mini{color:#e8ebdc;font-size:13px}#actions{display:flex;flex-wrap:wrap}\n#actions button{font-size:14px}.pair{background:#c5eed4}.muted{color:#abdeb9}\n.badge{display:inline-block;padding:4px;border-radius:6px;background:#35694b}\n@media(max-width:780px){main{padding:6px}h1{font-size:17px}.panel{margin:5px 0;padding:7px}button,select,input{min-height:40px}#actions button{padding:6px 10px}.card{min-width:42px;height:55px}}\n.board-line{display:flex;gap:3px;align-items:center;justify-content:center;margin:4px 0}\n.field-card,.field-empty{font-size:clamp(10px,1.45vw,15px);min-width:clamp(12px,2.2vw,23px);padding:4px 0;border-radius:3px;text-align:center}\n.field-card{background:#eeeccf;color:#263428;font-weight:700}.field-empty{background:#194934;color:#75a389}\n.hand-cards{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.card.selected{outline:3px solid #ffdd55;transform:translateY(-3px)}\n.card.back{background:#244879;color:white;font-size:22px}\n#notice{font-size:13px;color:#ffdb80;margin:5px}\n@media (max-height:500px){.card{height:50px;min-width:40px}main{padding:5px}.panel{padding:6px;margin:4px 0}h1{font-size:16px}}\n#chatToggle{background:#d7f4f2}\n#chatPanel{position:fixed;right:8px;bottom:8px;width:min(350px,calc(100vw - 16px));\n max-height:min(68vh,470px);z-index:20;background:#133e30;border:2px solid #97d2b5;\n border-radius:12px;box-shadow:0 8px 28px #071f19;padding:9px;display:flex;flex-direction:column;gap:6px}\n#chatPanel[hidden]{display:none}\n#chatList{min-height:95px;max-height:230px;overflow-y:auto;overscroll-behavior:contain;\n background:#082e21;border-radius:8px;padding:6px;overflow-wrap:anywhere;font-size:13px}\n.chat-msg{margin:5px 0;line-height:1.35}\n.chat-name{font-weight:800;color:#ffda7d;margin-right:6px}\n#chatCompose{display:flex;gap:4px}\n#chatInput{flex:1;min-width:0;max-width:none}\n#chatSend{flex:none}\n#chatStatus{font-size:12px;color:#ffdc8b;min-height:14px}\n@media(max-height:460px){#chatPanel{max-height:74vh}#chatList{max-height:110px;min-height:50px}}\n\u003c/style>\u003c/head>\u003cbody>\u003cmain>\n\u003ch1>🃏 トランプコレクション｜4人オンライン研究版\u003c/h1>\n\u003csmall>開発用のFirebase4人対戦ページ。\u003cstrong>Firebase接続先が未設定の間は部屋を作成できません。\u003c/strong> 学校のGoogle Sites版・公開版は変更せず、実機試験前の開発用として使います。ページを再読み込みした場合は、新しい部屋を作り直してください。\u003c/small>\n\u003cdiv class=\"panel\">\u003cselect id=\"game\">\u003coption value=\"babanuki\">ババ抜き\u003c/option>\u003coption value=\"shichinarabe\">七並べ\u003c/option>\u003coption value=\"daifugo\">大富豪\u003c/option>\u003c/select>\n\u003cbutton id=\"create\">部屋を作る\u003c/button>\u003cinput id=\"code\" placeholder=\"5桁番号\" maxlength=\"5\" inputmode=\"numeric\">\u003cbutton id=\"join\">参加\u003c/button>\n\u003cdiv id=\"status\" role=\"status\">ゲームを選んで部屋作成、友達は5桁の番号で参加\u003c/div>\u003c/div>\n\u003cdiv id=\"lobby\" class=\"panel\" hidden>\u003cdiv id=\"notice\" role=\"status\">\u003c/div>\u003cdiv>部屋 \u003cspan id=\"roomCode\">\u003c/span> \u003cspan id=\"role\">\u003c/span> \u003cspan id=\"roster\">\u003c/span>\u003c/div>\n\u003cbutton id=\"ready\">準備する\u003c/button>\u003cbutton id=\"start\">全員準備OK → 開始\u003c/button>\u003cbutton id=\"rematch\">再戦\u003c/button>\u003cbutton id=\"leave\">退出・部屋を作り直す\u003c/button>\u003cbutton id=\"chatToggle\" type=\"button\" aria-expanded=\"false\">💬 チャット\u003c/button>\u003c/div>\n\u003cdiv id=\"match\" class=\"panel\" hidden>\u003cdiv id=\"state\" class=\"mini\">\u003c/div>\u003cdiv id=\"board\">\u003c/div>\u003cdiv id=\"hand\">\u003c/div>\u003cdiv id=\"actions\">\u003c/div>\u003c/div>\n\u003c/main>\n\u003csection id=\"chatPanel\" aria-label=\"ルーム内チャット\" hidden>\n \u003cdiv style=\"display:flex;justify-content:space-between;align-items:center\">\u003cstrong>💬 ルーム内チャット\u003c/strong>\u003cbutton id=\"chatClose\" type=\"button\">閉じる\u003c/button>\u003c/div>\n \u003cdiv id=\"chatList\" role=\"log\" aria-live=\"polite\" aria-relevant=\"additions text\">\u003c/div>\n \u003cform id=\"chatCompose\">\u003cinput id=\"chatInput\" maxlength=\"120\" autocomplete=\"off\" aria-label=\"チャットメッセージ\" placeholder=\"メッセージ（120文字まで）\">\u003cbutton id=\"chatSend\" type=\"submit\">送信\u003c/button>\u003c/form>\n \u003cdiv id=\"chatStatus\" role=\"status\">\u003c/div>\n\u003c/section>\u003cscript>\n// トランプゲーム集 共通ロジック＋4ゲーム＋BOT（描画なし・Nodeでも動作）\nfunction mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nconst SUITS = ['♠', '♥', '♦', '♣'];\nconst SUIT_NAMES = ['スペード', 'ハート', 'ダイヤ', 'クラブ'];\nfunction cardId(c) { return c.joker ? 'JK' : c.suit + '-' + c.rank; }\nfunction makeDeck(jokers = 0) { const d = []; for (let s = 0; s \u003c 4; s++) for (let r = 1; r \u003c= 13; r++) d.push({ suit: s, rank: r }); for (let i = 0; i \u003c jokers; i++) d.push({ joker: true }); return d; }\nfunction shuffle(deck, rng) { const d = deck.slice(); for (let i = d.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0;[d[i], d[j]] = [d[j], d[i]]; } return d; }\nfunction sortHand(hand) { return hand.slice().sort((a, b) => (a.joker ? 99 : a.suit * 100 + a.rank) - (b.joker ? 99 : b.suit * 100 + b.rank)); }\nfunction removePairs(hand) { // ババ抜き用: 同じ数字のペアを取り除く\n  const byRank = new Map(); const rest = [];\n  for (const c of hand) { if (c.joker) { rest.push(c); continue; } if (!byRank.has(c.rank)) byRank.set(c.rank, []); byRank.get(c.rank).push(c); }\n  const pairs = [];\n  for (const [, cs] of byRank) { const n = cs.length - (cs.length % 2); for (let i = 0; i \u003c n; i++) pairs.push(cs[i]); for (let i = n; i \u003c cs.length; i++) rest.push(cs[i]); }\n  return { hand: rest, pairs };\n}\n\n// ============ ババ抜き ============\nfunction createBabanuki(seed, players = 4) {\n  const rng = mulberry32(seed);\n  const deck = shuffle(makeDeck(1), rng);\n  const hands = Array.from({ length: players }, () => []);\n  deck.forEach((c, i) => hands[i % players].push(c));\n  const st = { game: 'babanuki', hands: hands.map(h => removePairs(h).hand), turn: 0, ranks: {}, finishedOrder: [], phase: 'play', loser: -1, lastDraw: null };\n  st.hands.forEach((h, i) => { if (h.length === 0) { st.ranks[i] = Object.keys(st.ranks).length + 1; st.finishedOrder.push(i); } });\n  while (st.hands[st.turn].length === 0) st.turn = (st.turn + 1) % players;\n  return st;\n}\nfunction babanukiNextWithCards(st, from) { let n = from; do { n = (n + 1) % st.hands.length; } while (st.hands[n].length === 0 && n !== from); return n; }\nfunction babanukiDraw(st, cardIndex) {\n  if (st.phase !== 'play') return st; ror('ROOM_CODE_REQUIRED');\n   roomCode=input;\n   const meta=await store.meta(roomCode);\n   if(!meta||meta.protocol!==2||!GAMES[meta.game])throw Error('ROOM_NOT_FOUND');\n   game=meta.game;\n  }\n  if(epoch!==session)return;\n  guestRunner=createFirebaseRoomGuest({store,roomCode,game,actionIdSource:randomAction});\n  if(!asHost)await guestRunner.requestJoin();\n  if(epoch!==session)return;\n  $('game').value=game;$('game').disabled=true;\n  $('lobby').hidden=false;\n  $('create').disabled=$('join').disabled=true;\n  busy=false;\n  status(asHost?'ルーム作成成功。友達の参加を待っています':'入室申請中。ホストの承認を待っています');\n  schedule(epoch,10);\n }catch(err){\n  if(epoch!==session)return;\n  busy=false;status('接続できません：'+describe(err));\n  clear(); // preserves status message\n }\n}\nfunction describe(e){\n const key=e?.code||e?.message||String(e);\n return ({\n  FIREBASE_CONFIG_MISSING:'Firebase接続先が未設定（開発用画面）',\n  TRIAL_PROJECT_MISMATCH:'試遊用のFirebase接続先が一致しません',\n  FIREBASE_PROJECT_NOT_ALLOWED:'トランプ用または確認済みの既存Firebaseプロジェクトを指定してください',\n  FIREBASE_PROJECT_DATABASE_MISMATCH:'Firebaseプロジェクト名とDBアドレスが一致しません',\n  FIREBASE_TEST_TRANSPORT_FORBIDDEN:'テスト用の通信設定はローカルの検証環境でのみ使用可能です',\n  UNEXPECTED_FIREBASE_CONFIG_FIELD:'接続設定に許可されていない項目があります',\n  ROOM_CODE_REQUIRED:'5桁の番号を入力してね',ROOM_NOT_FOUND:'ルームが見つかりません',\n  ROOM_CODE_COLLISION:'部屋番号が混雑しています。もう一度作成',\n  PERMISSION_DENIED:'通信権限がありません。認証・DBルールを確認',\n  NETWORK_ERROR:'ネットワーク通信に失敗',\n  FIREBASE_AUTH_REJECTED:'匿名認証が許可されていません',\n  NO_SYNCED_VIEW:'最新の状態を同期中'\n })[key]||key;\n}\nfunction schedule(epoch,delay){\n if(!shouldRun(epoch))return;\n clearTimeout(tickTimer);\n tickTimer=setTimeout(()=>poll(epoch),delay);\n}\nasync function poll(epoch){\n if(!shouldRun(epoch)||pollWorking)return;\n pollWorking=true;\n try{\n  if(isHost){\n   const hostResult=await hostRunner.tick();\n   if(hostResult.closed){\n    clear();status('参加者が退出したため対戦は終了しました。新しい部屋を作れます');\n    return;\n   }\n  }\n  if(!shouldRun(epoch))return;\n  const result=await guestRunner.poll();\n  if(!should rematch').hidden=!isHost||v.phase!=='finished';\n $('rematch').disabled=!usable;\n $('match').hidden=v.phase==='lobby';\n const state=$('state'),board=$('board'),hand=$('hand'),actions=$('actions');\n board.replaceChildren();hand.replaceChildren();actions.replaceChildren();\n state.textContent=GAMES[game]+'｜'+(v.phase==='finished'?'結果':acting?'あなたの番':'相手の番')+\n  '｜手札 '+(v.counts||[]).join(' / ')+'｜通信 '+(online?'OK':'再接続中');\n setupInfo(v.phase==='lobby'?'4人が準備したらホストが開始します':v.phase==='finished'?'対戦終了！ 再戦できます':acting?'カードを選んで操作してね':'相手の操作を待っています');\n if(v.phase==='finished'){\n  appendText(actions,'順位： '+Object.entries(v.ranks||{}).sort((a,b)=>a[1]-b[1]).map(([seat,r])=>(Number(seat)===p?'自分':'席'+(Number(seat)+1))+' '+r+'位').join(' / '));\n }\n if(v.phase!=='playing'&&v.phase!=='finished')return;\n if(game==='babanuki'){\n  appendText(board,'引く相手：席'+(Number(v.drawFrom)+1)+'　','mini');\n  if(acting&&usable&&v.drawFrom!==p&&v.counts[v.drawFrom]>0){\n   for(let i=0;i\u003cv.counts[v.drawFrom];i++)board.appendChild(button('🂠',()=>send('draw',{index:i}),false,'card back'));\n  }else appendText(board,acting?'操作待ち':'相手の手番です','muted');\n  if(privateState?.lastDraw?.card)appendText(board,' 引いた：'+cardText(privateState.lastDraw.card)+(privateState.lastDraw.paired?'（ペア成立）':''));\n }else if(game==='shichinarabe'){\n  const placed=v.placed||[];\n  for(let suit=0;suit\u003c4;suit++){\n   const line=document.createElement('div');line.className='board-line';\n   appendText(line,UI_SUITS[suit]+' ','mini');\n   for(let rank=1;rank\u003c=13;rank++){\n    const inField=placed[suit]&&rank>=placed[suit].low&&rank\u003c=placed[suit].high;\n    appendText(line,inField?(CARD_NAMES[rank]||rank)+'':'·',inField?'field-card':'field-empty');\n   }\n   board.appendChild(line);\n  }\n  // Like COM mode, selecting a card must never send it immediately.\n  // Requiring an explicit confirmation avoids accidental touches on iPad.\n  const pick=[...selected][0];\n  const canConfirm=selected.size===1&&(pri ria-expanded=\"false\">💬 チャット\u003c/button>\u003c/div>\n  \u003cdiv class=\"row\">\u003cbutton id=\"ready\">準備OK\u003c/button>\u003cbutton id=\"start\">対戦開始\u003c/button>\u003cbutton id=\"again\">再戦ロビーへ\u003c/button>\u003c/div>\n  \u003cdiv id=\"notice\">\u003c/div>\n\u003c/section>\n\u003csection id=\"gameArea\" class=\"panel\">\n  \u003cdiv class=\"row\">\u003cspan id=\"turn\">\u003c/span>\u003cspan id=\"score\">\u003c/span>\u003c/div>\u003cdiv id=\"board\" aria-label=\"神経衰弱のカード24枚\">\u003c/div>\n\u003c/section>\n\u003c/main>\u003csection id=\"chatPanel\" aria-label=\"ルーム内チャット\" hidden>\n \u003cdiv class=\"row\" style=\"justify-content:space-between\">\u003cstrong>💬 ルーム内チャット\u003c/strong>\u003cbutton id=\"chatClose\" type=\"button\">閉じる\u003c/button>\u003c/div>\n \u003cdiv id=\"chatList\" role=\"log\" aria-live=\"polite\">\u003c/div>\n \u003cform id=\"chatCompose\" class=\"row\">\u003cinput id=\"chatInput\" maxlength=\"120\" autocomplete=\"off\" aria-label=\"チャットメッセージ\" placeholder=\"メッセージ（120文字まで）\">\u003cbutton id=\"chatSend\" type=\"submit\">送信\u003c/button>\u003c/form>\n \u003cdiv id=\"chatStatus\" role=\"status\">\u003c/div>\n\u003c/section>\n\u003cscript>// トランプゲーム集 共通ロジック＋4ゲーム＋BOT（描画なし・Nodeでも動作）\nfunction mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }\nconst SUITS = ['♠', '♥', '♦', '♣'];\nconst SUIT_NAMES = ['スペード', 'ハート', 'ダイヤ', 'クラブ'];\nfunction cardId(c) { return c.joker ? 'JK' : c.suit + '-' + c.rank; }\nfunction makeDeck(jokers = 0) { const d = []; for (let s = 0; s \u003c 4; s++) for (let r = 1; r \u003c= 13; r++) d.push({ suit: s, rank: r }); for (let i = 0; i \u003c jokers; i++) d.push({ joker: true }); return d; }\nfunction shuffle(deck, rng) { const d = deck.slice(); for (let i = d.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0;[d[i], d[j]] = [d[j], d[i]]; } return d; }\nfunction sortHand(hand) { return hand.slice().sort((a, b) => (a.joker ? 99 : a.suit * 100 + a.rank) - (b.joker ? 99 : b.suit * 100 + b.rank)); }\nfunction removePairs(hand) { // ババ抜き用: 同じ数字のペアを取り除く\n  const byRank = new Map(); const rest = [];\n  for (const c of hand) { if (c.joker) { rest.push(c); continue; } if (!byRank.has(c.rank)) byRank.set(c.rank, []); byRank.get(c.rank).push(c); }\n  const pairs = [];\n  for (const [, cs] of byRank) { const n = cs.length - (cs.length % 2); for (let i = 0; i \u003c n; i++) pairs.push(cs[i]); for (let i = n; i \u003c cs.length; i++) rest.push(cs[i]); }\n  return { hand: rest, pairs };\n}\n\n// ============ ババ抜き ============\nfunction createBabanuki(seed, players = 4) {\n  const rng = mulberry32(seed);\n  const deck = shuffle(makeDeck(1), rng);\n  const hands = Array.from({ length: players }, () => []);\n  deck.forEach((c, i) => hands[i % players].push(c));\n  const st = { game: 'babanuki', hands: hands.map(h => removePairs(h).hand), turn: 0, ranks: {}, finishedOrder: [], phase: 'play', loser: -1, lastDraw: null };\n  st.hands.forEach((h, i) => { if (h.length === 0) { st.ranks[i] = Object.keys(st.ranks).length + 1; st.finishedOrder.push(i); } });\n  while (st.hands[st.turn].length === 0) st.turn = (st.turn + 1) % players;\n  return st;\n}\nfunction babanukiNextWithCards(st, from) { let n = from; do { n = (n + 1) % st.hands.length; } while (st.hands[n].length === 0 && n !== from); return n; }\nfunction babanukiDraw(st, cardIndex) {\n  if (st.phase !== 'play') return st;\n  const me = st.turn, target = babanukiNextWithCards(st, me);\n  if (target === me) { st.phase = 'end'; return st; }\n  if (!Number.isInteger(cardIndex) || cardIndex \u003c 0 || cardIndex >= st.hands[target].length) return st;\n  const card = st.hands[target].splice(cardIndex, 1)[0];\n  st.hands[me].push(card);\n  st.lastDraw = { from: target, by: me, card };\n  const before = st.hands[me].length;\n  st.hands[me] = removePairs(st.hands[me]).hand;\n  const paired = st.hands[me].length \u003c before;\n  st.lastDraw.paired = paired;\n  for (const p of [target, me]) if (st.hands[p].length === 0 && st.ranks[p] === undefined) { st.ranks[p] = Object.keys(st.ranks).length + 1; st.finishedOrder.push(p); }\n  const alive = st.hands.map((h, i) => ({ h, i })).filter(o => o.h.length > 0);\n  if (alive.length \u003c= 1) { st.phase = 'end'; st.loser = alive.length ? alive[0].i : -1; if (st.loser >= 0) st.ranks[st.loser] = st.hands.length; return st; }\n  st.turn = babanukiNextWithCards(st, me);\n  return st;\n}\nfunction botBabanuki(st) { const target = babanukiNextWithCards(st, st.turn); return (Math.random() * st.hands[target].length) | 0; }\n\n// ============ 七並べ ============\nfunction createShichinarabe(seed, players = 4) {\n  const rng = mulberry32(seed);\n  const deck = shuffle(makeDeck(0), rng);\n  const hands = Array.from({ length: players }, () => []);\n  deck.forEach((c, i) => hands[i % players].push(c));\n  const st = { game: 'shichinarabe', hands, placed: [null, null, null, null].map(() => ({ low: 8, high: 6 })), pending: [], turn: 0, passes: Array(players).fill(0), ranks: {}, out: Array(players).fill(false), phase: 'play', lastAction: null };\n  // 7を最初から場に出す\n  st.hands.forEach((h, p) => { st.hands[p] = h.filter(c => { if (c.rank === 7) { st.placed[c.suit] = { low: 7, high: 7 }; return false; } return true; }); });\n  const d3 = st.hands.findIndex(h => h.some(c => c.suit === 2 && c.rank === 3));\n  st.turn = d3 >= 0 ? d3 : 0;\n  shichinarabeAutoPlace(st);\n  return st;\n}\nfunction shichinarabeAutoPlace(st) { // pending（脱落者のカード）が隣接したら自動で並べる\n  let moved = true;\n  while (moved) { moved = false; st.pending = st.pending.filter(c => { const pl = st.placed[c.suit]; if (c.rank === pl.low - 1) { pl.low = c.rank; moved = true; return false; } if (c.rank === pl.high + 1) { pl.high = c.rank; moved = true; return false; } return true; }); }\n}\nfunction shichinarabeLegal(hand, placed) { return hand.filter(c => c.rank === placed[c.suit].low - 1 || c.rank === placed[c.suit].high + 1); }\nfunction shichinarabePlay(st, id) {\n  if (st.phase !== 'play') return st;\n  const p = st.turn, idx = st.hands[p].findIndex(c => cardId(c) === id);\n  if (idx \u003c 0) return st;\n  const c = st.hands[p][idx], pl = st.placed[c.suit];\n  if (!(c.rank === pl.low - 1 || c.rank === pl.high + 1)) return st;\n  st.hands[p].splice(idx, 1);\n  if (c.rank === pl.low - 1) pl.low = c.rank; else pl.high = c.rank;\n  st.lastAction = { player: p, type: 'play', card: c };\n  shichinarabeAutoPlace(st);\n  if (st.hands[p].length === 0 && st.ranks[p] === undefined) { st.ranks[p] = Object.keys(st.ranks).length + 1; }\n  shichinarabeAdvance(st);\n  return st;\n}\nfunction shichinarabePass(st) {\n  if (st.phase !== 'play') return st;\n  const p = st.turn;\n  st.passes[p]++;\n  st.lastAction = { player: p, type: 'pass', count: st.passes[p] };\n  if (st.passes[p] >= 4 && !st.out[p]) { // 4回目のパスで脱落：手札は pending へ\n    st.out[p] = true; st.pending.push(...st.hands[p]); st.hands[p] = [];\n    st.ranks[p] = 99; // 暫定（最後に最下位へ）\n    shichinarabeAutoPlace(st);\n  }\n  shichinarabeAdvance(st);\n  return st;\n}\nfunction shichinarabeAdvance(st) {\n  const total = st.hands.length;\n  const remaining = st.hands.map((h, i) => i).filter(i => !st.out[i] && st.hands[i].length > 0);\n  if (remaining.length \u003c= 1) { st.phase = 'end'; // 順位の正規化: 上がり順 → 最後まで残った人 → 脱落者\n    const order = [];\n    Object.entries(st.ranks).filter(([, v]) => v !== 99).sort((a, b) => a[1] - b[1]).forEach(([k]) => order.push(Number(k)));\n    remaining.forEach(i => { if (!order.includes(i)) order.push(i); });\n    st.hands.forEach((h, i) => { if (st.out[i] && !order.includes(i)) order.push(i); });\n    order.forEach((p, idx) => st.ranks[p] = idx + 1);\n    return;\n  }\n  let n = st.turn;\n  do { n = (n + 1) % total; } while (st.out[n] || st.hands[n].length === 0);\n  st.turn = n;\n}\nfunction botShichinarabe(st) {\n  const p = st.turn, hand = st.hands[p];\n  const legal = shichinarabeLegal(hand, st.placed);\n  if (!legal.length) return { type: 'pass' };\n  // 次の手番でも出せる自分の連番を多く開く。相手の非公開カードは参照しない。\n  const score = c => {\n    const step = c.rank \u003c 7 ? -1 : 1;\n    let chain = 0;\n    for (let rank = c.rank + step; rank >= 1 && rank \u003c= 13; rank += step) {\n      if (hand.some(x => x.suit === c.suit && x.rank === rank)) chain++;\n      else break;\n    }\n    return chain * 10 + hand.filter(x => x.suit === c.suit).length * 0.2;\n  };\n  legal.sort((a, b) => score(b) - score(a));\n  // 意図的なパスは2000試合の比較で成績が悪化したため導入しない。\n  return { type: 'play', id: cardId(legal[0]) };\n}\n\n// ============ 神経衰弱 ============\nfunction createShinkei(seed, difficulty = 1) {\n  const rng = mulberry32(seed);\n  const cards = [];\n  for (let s = 0; s \u003c 4; s++) for (let r = 1; r \u003c= 6; r++) cards.push({ suit: s, rank: r });\n  const board = shuffle(cards, rng).map(c => ({ card: c, taken: false }));\n  return { game: 'shinkei', board, turn: 0, scores: [0, 0], flipped: [], phase: 'play', winner: -1, difficulty, memory: new Map(), lastResult: null, lastPair: null };\n}\nfunction shinkeiObserve(st, pos) { const c = st.board[pos].card; st.memory.set(pos, c.suit + '-' + c.rank); if (st.difficulty === 0 && st.memory.size > 6) { const k = st.memory.keys().next().value; st.memory.delete(k); } if (st.difficulty === 1 && st.memory.size > 14) { const k = st.memory.keys().next().value; st.memory.delete(k); } }\nfunction shinkeiFlip(st, pos) {\n  if (st.phase !== 'play' || !Number.isInteger(pos) || pos \u003c 0 || pos >= st.board.length || st.board[pos].taken || st.flipped.includes(pos) || st.flipped.length >= 2) return st;\n  st.flipped.push(pos); shinkeiObserve(st, pos);\n  if (st.flipped.length === 2) {\n    const [a, b] = st.flipped, ca = st.board[a].card, cb = st.board[b].card;\n    st.lastPair = { positions: [a, b] };\n    if (ca.rank === cb.rank) { st.board[a].taken = st.board[b].taken = true; st.scores[st.turn]++; st.memory.delete(a); st.memory.delete(b); st.lastResult = { match: true, player: st.turn }; st.flipped = []; }\n    else { st.lastResult = { match: false, player: st.turn }; st.flipped = []; st.turn = 1 - st.turn; if (st.difficulty === 0) { /* 弱いCOMは見たカードをよく忘れる */ for (const k of [...st.memory.keys()]) if (Math.random() \u003c 0.4) st.memory.delete(k); } }\n    if (st.board.every(x => x.taken)) { st.phase = 'end'; st.winner = st.scores[0] === st.scores[1] ? -1 : (st.scores[0] > st.scores[1] ? 0 : 1); }\n  }\n  return st;\n}\nfunction botShinkei(st) {\n  // 既知のペアがあれば取る。なければ未知をめくり、既知と合えば取る\n  const known = [...st.memory.entries()].filter(([pos]) => !st.board[pos].taken);\n  if (st.flipped.length === 0) {\n    const byRank = new Map();\n    for (const [pos, key] of known) { const r = key.split('-')[1]; if (!byRank.has(r)) byRank.set(r, []); byRank.get(r).push(pos); }\n    for (const [, ps] of byRank) if (ps.length >= 2) return ps[0];\n    const unknown = st.board.map((b, i) => i).filter(i => !st.board[i].taken && !st.memory.has(i));\n    return unknown.length ? unknown[(Math.random() * unknown.length) | 0] : known[0]?.[0] ?? 0;\n  }\n  const first = st.board[st.flipped[0]].card;\n  const matchPos = known.find(([pos, key]) => pos !== st.flipped[0] && key.split('-')[1] === String(first.rank));\n  if (matchPos) return matchPos[0];\n  const unknown = st.board.map((b, i) => i).filter(i => !st.board[i].taken && i !== st.flipped[0] && !st.memory.has(i));\n  return unknown.length ? unknown[(Math.random() * unknown.length) | 0] : known.find(([pos]) => pos !== st.flipped[0])?.[0] ?? 0;\n}\n\n// ============ 大富豪 ============\nconst DAIFUGO_DEFAULTS = { eightCut: true, revolution: true, suitLock: true, spade3: true, elevenBack: true, foulFinish: true, tribute: true };\nfunction rankValue(c) { if (c.joker) return 13; return c.rank === 1 ? 11 : c.rank === 2 ? 12 : c.rank - 3; } // 3=0 … K=10, A=11, 2=12, JOKER=13\nfunction createDaifugo(seed, cfg = DAIFUGO_DEFAULTS, prevRanks = null) {\n  const rng = mulberry32(seed);\n  const deck = shuffle(makeDeck(1), rng);\n  const hands = [[], [], [], []];\n  deck.forEach((c, i) => hands[i % 4].push(c));\n  const st = { game: 'daifugo', cfg, hands, turn: 0, field: null, revolution: false, ranks: {}, finished: [], fouls: [], phase: 'play', lastEvent: 'ゲーム開始', passStreak: 0, leader: 0, tributeLog: [] };\n  if (prevRanks && cfg.tribute) { // 献上: 大貧民→大富豪2枚 / 貧民→富豪1枚（自動で最強を渡し、最弱を受け取る）\n    const order = Object.entries(prevRanks).sort((a, b) => a[1] - b[1]).map(([k]) => Number(k)); // [大富豪, 富豪, 貧民, 大貧民]\n    const exch = (from, to, n) => { const fh = hands[from].sort((a, b) => rankValue(b) - rankValue(a)); const give = fh.splice(0, n); const th = hands[to].sort((a, b) => rankValue(a) - rankValue(b)); const back = th.splice(0, n); hands[from].push(...back); hands[to].push(...give); st.tributeLog.push(`${from}→${to} ${n}枚`); };\n    exch(order[3], order[0], 2); exch(order[2], order[1], 1);\n    st.turn = order[0]; st.leader = order[0];\n  } else { const d3 = hands.findIndex(h => h.some(c => c.suit === 2 && c.rank === 3)); st.turn = d3 >= 0 ? d3 : 0; st.leader = st.turn; }\n  st.hands = st.hands.map(sortHand);\n  return st;\n}\nfunction combosOf(hand) { // 同じ数字のあらゆるスートの組み合わせを列挙\n  const groups = new Map(); let joker = null;\n  for (const c of hand) { if (c.joker) { joker = c; continue; } if (!groups.has(c.rank)) groups.set(c.rank, []); groups.get(c.rank).push(c); }\n  const out = [];\n  if (joker) out.push([joker]);\n  for (const [, cs] of groups) {\n    // 接頭辞だけを列挙すると「♥5のみ」など合法手が消えるため、全ての非空部分集合を生成\n    for (let mask = 1; mask \u003c (1 \u003c\u003c cs.length); mask++) {\n      const subset = cs.filter((_, i) => (mask & (1 \u003c\u003c i)) !== 0);\n      out.push(subset);\n      if (joker) out.push([...subset, joker]);\n    }\n  }\n  return out;\n}\nfunction comboInfo(cards, st) {\n  const nonJ = cards.filter(c => !c.joker);\n  const rank = nonJ.length ? nonJ[0].rank : null;\n  const value = cards.length === 1 && cards[0].joker ? 99 : rankValue(nonJ[0]);\n  const suits = new Set(nonJ.map(c => c.suit));\n  return { count: cards.length, rank, value, suits, hasJoker: cards.some(c => c.joker), has8: nonJ.some(c => c.rank === 8), hasJ: nonJ.some(c => c.rank === 11) };\n}\nfunction daifugoLegalMoves(st, p) {\n  const hand = st.hands[p], cfg = st.cfg, f = st.field;\n  let moves = combosOf(hand);\n  if (!f) return moves;\n  const rev = st.revolution !== (f.tempReverse || false); // 実効の反転状態（革命 XOR イレブンバック）\n  moves = moves.filter(cs => {\n    if (cs.length !== f.count) return false;\n    const info = comboInfo(cs, st);\n    if (cfg.spade3 && f.isJokerSingle && cs.length === 1 && !cs[0].joker && cs[0].suit === 0 && cs[0].rank === 3) return true;\n    if (cfg.suitLock && f.lockSuits) { // ジョーカーは不足したスート1つを補える\n      const extra = [...info.suits].filter(s => !f.lockSuits.has(s)).length;\n      const missing = [...f.lockSuits].filter(s => !info.suits.has(s)).length;\n      if (extra > 0 || missing > (info.hasJoker ? 1 : 0)) return false;\n    }\n    if (f.value === 99) return false; // ジョーカー単体にはスペ3以外出せない\n    if (info.value === 99) return true;\n    return rev ? info.value \u003c f.value : info.value > f.value;\n  });\n  return moves;\n}\nfunction daifugoPlay(st, p, cards) {\n  if (st.phase !== 'play' || st.turn !== p) return st;\n  const legal = daifugoLegalMoves(st, p);\n  const ids = cards.map(cardId).sort().join(',');\n  const ok = legal.some(m => m.map(cardId).sort().join(',') === ids);\n  if (!ok) return st;\n  const info = comboInfo(cards, st);\n  const prevField = st.field;\n  const spade3Clear = !!(st.cfg.spade3 && prevField?.isJokerSingle && cards.length === 1 && !cards[0].joker && cards[0].suit === 0 && cards[0].rank === 3);\n  for (const c of cards) { const i = st.hands[p].findIndex(h => cardId(h) === cardId(c)); st.hands[p].splice(i, 1); }\n  let lockSuits = prevField?.lockSuits || null;\n  if (st.cfg.suitLock && prevField && !prevField.lockSuits && prevField.suits && info.suits.size === prevField.suits.size && [...info.suits].every(s => prevField.suits.has(s)) && info.count === prevField.count) lockSuits = new Set(info.suits);\n  st.field = { cards, count: info.count, value: info.value, suits: info.suits, lockSuits, isJokerSingle: info.count === 1 && info.hasJoker && info.rank === null, tempReverse: prevField?.tempReverse || false, lastPlayer: p };\n  if (st.cfg.elevenBack && info.hasJ) st.field.tempReverse = !st.field.tempReverse;\n  st.passStreak = 0;\n  const events = [];\n  if (st.cfg.revolution && info.count >= 4) { st.revolution = !st.revolution; events.push(st.revolution ? '革命！' : '革命鎮圧！'); }\n  // 上がり判定\n  if (st.hands[p].length === 0) {\n    let foul = false;\n    if (st.cfg.foulFinish && (info.value === 12 || info.hasJoker || (st.cfg.eightCut && info.has8))) foul = true;\n    if (foul) { st.fouls.push(p); st.finished.push(p); events.push('反則上がり！ 大貧民に'); }\n    else { st.finished.push(p); events.push('上がり！'); }\n    if (st.finished.length >= 3) { // 順位確定: 上がり順 → 最後まで残った人 → 反則者\n      const order = st.finished.filter(i => !st.fouls.includes(i));\n      const lastP = [0, 1, 2, 3].find(i => !st.finished.includes(i));\n      if (lastP !== undefined) order.push(lastP);\n      st.fouls.forEach(i => order.push(i));\n      order.forEach((pl, idx) => st.ranks[pl] = idx + 1);\n      st.phase = 'end'; st.lastEvent = events.join('／'); return st; }\n    if (st.finished.length === 2) { /* 残り2人のうち場のリード権は次へ */ }\n  }\n  // 8切り\n  if (st.phase === 'play' && (spade3Clear || (st.cfg.eightCut && info.has8))) { st.field = null; st.lastEvent = (events.join('／') + (spade3Clear ? ' スペ3返し！続けて出せる' : ' 8切り！続けて出せる')).trim(); if (!st.finished.includes(p)) { st.turn = p; st.leader = p; } else { st.turn = daifugoNext(st, p); st.leader = st.turn; } return st; }\n  st.lastEvent = events.join('／');\n  st.turn = daifugoNext(st, p);\n  return st;\n}\nfunction daifugoPass(st, p) {\n  if (st.phase !== 'play' || st.turn !== p || !st.field) return st;\n  st.passStreak++;\n  const activeCount = [0, 1, 2, 3].filter const GAME_NAMES={babanuki:'ババ抜き',shichinarabe:'七並べ',shinkei:'神経衰弱',daifugo:'大富豪'};
const q=id=>document.getElementById(id);
let selected='babanuki',openMode=null;
function choose(game){
 if(!Object.prototype.hasOwnProperty.call(GAME_NAMES,game))return;
 selected=game;
 for(const item of document.querySelectorAll('[data-game]'))
  item.setAttribute('aria-pressed',String(item.dataset.game===game));
 q('selection').textContent=GAME_NAMES[game];
 q('hint').textContent=game==='shinkei'
  ?'友達対戦は2人用Supabase試作。PC・スマホで試遊実績あり（学校Safariは未確認）'
  :window.TRUMP_FIREBASE_OPEN_ROOT_TRIAL===true
   ?'試遊用：現在のFirebaseは誰でも手札・チャットを読める公開設定です。個人情報は入力しないでください'
   :'友達対戦は4人用Firebase開発版。実Firebase本番への接続は未設定です';
}
function configureFriendsGame(html,game){
 // In a Google Sites iframe, the nested srcdoc may have an opaque origin.
 // Pass game selection *inside* the child HTML instead of reaching into
 // frame.contentDocument from the parent after load.
 const config=window.TRUMP_FIREBASE_CONFIG;
 let setup='window.TRUMP_INITIAL_GAME='+JSON.stringify(game)+';';
 const openRootTrial=window.TRUMP_FIREBASE_OPEN_ROOT_TRIAL===true;
 if(config&&config.databaseURL&&(config.apiKey||openRootTrial)){
  // The Web API key is public; admin credentials must NEVER be embedded here.
  const json=JSON.stringify(openRootTrial?
   {projectId:config.projectId,databaseURL:config.databaseURL}:
   {projectId:config.projectId,apiKey:config.apiKey,databaseURL:config.databaseURL}).replace(/</g,'\\u003c');
  setup+='window.TRUMP_FIREBASE_CONFIG='+json+';';
  if(openRootTrial)setup+='window.TRUMP_FIREBASE_OPEN_ROOT_TRIAL=true;';
 }
 return html.replace('<script>',()=>'<script>'+setup+'</'+'script><script>');
}
function show(game,mode){
 if(!Object.prototype.hasOwnProperty.call(GAME_NAMES,game))return;
 if(mode!=='com'&&mode!=='friends')return;
 const frame=q('play');
 let src=mode==='com'?APP_HTML.com:game==='shinkei'?APP_HTML.memory:configureFriendsGame(APP_HTML.friends4,game);
 q('viewerTitle').textContent=GAME_NAMES[game]+'｜'+(mode==='com'?'COM対戦':'友達対戦（開発版）');
 q('viewer').classList.add('open');

// Leaving an online game via the collection's own Back button must notify
// its host/guest controller before discarding the nested iframe. The two
// frames can have different origins inside Google Sites: use postMessage.
// Never trap players if Firebase is offline; fall back after 1.8 seconds.
let backWorking=false,leaveRequestSequence=0;
function askFriendsToLeave(frame){
 return new Promise(resolve=>{
  const target=frame.contentWindow;
  if(!target){resolve();return;}
  const requestId='back-'+(++leaveRequestSequence);
  let done=false,timeout=null;
  const complete=()=>{
   if(done)return;
   done=true;clearTimeout(timeout);
   window.removeEventListener('message',onReply);
   resolve();
  };
  const onReply=e=>{
   if(e.source===target&&e.data?.type==='tc:leave-ack'&&e.data.requestId===requestId)
    complete();
  };
  window.addEventListener('message',onReply);
  timeout=setTimeout(complete,1800);
  try{target.postMessage({type:'tc:leave-room',requestId},'*');}
  catch{complete();}
 });
}
q('back').onclick=async()=>{
 if(backWorking)return;
 backWorking=true;

 const frame=q('play');
 try{
  if(openMode==='friends'){
   q('back').textContent='退出中…';
   await askFriendsToLeave(frame);
  }
 }finally{
  frame.removeAttribute('srcdoc');
  frame.src='about:blank';
  q('viewer').classList.remove('open');
  openMode=null;
  q('back').textContent='← ゲーム一覧';
  q('back').disabled=false;
  backWorking=false;
  q('com').focus();
 }
};
