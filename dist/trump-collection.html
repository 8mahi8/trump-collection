    .card.small { width:calc(var(--cw) * 0.7); height:calc(var(--cw) * 1.01); border-radius:6px; font-size:calc(var(--cw) * 0.185); }

  #hand .card.sel { transform:translateY(-38px) scale(1.07); outline:4px solid #ffd94a; box-shadow:0 0 18px 4px rgba(255,217,74,.75), 0 18px 24px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.95); z-index:6; }

  /* 横向きスマホやGoogle Sites埋め込みの低いiframeでも盤面が切れないようにする */
  #gameScreen.shinkei #handArea { display:none; }
  #gameScreen.shinkei #center { padding:3px 6px; }
  #gameScreen.shinkei #grid { grid-template-columns:repeat(6, min(calc(var(--cw) * .84), 10.5vh, 12vw)); gap:min(6px, 1vh); }
  #gameScreen.shinkei #grid .card { width:100%; height:auto; aspect-ratio:1 / 1.44; }
  #rows .slot, #rows .card.tiny { width:clamp(23px, calc((100vw - 67px) / 13), 34px); }
  #rows .card.tiny .tl { font-size:clamp(8px, 1.8vw, 11px); }
  #message { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
  @media (max-height:500px) { .opp .backs { display:none; } .opp { min-width:70px; padding:3px 5px; } .opp .face { font-size:18px; } #handArea { padding-top:0; } #topbar { padding-top:2px; padding-bottom:2px; } #handLabel { display:none; } .fieldcards .card.small { width:calc(var(--cw) * 0.6); height:calc(var(--cw) * 0.87); } #actions { margin-top:4px; min-height:40px; } .abtn { padding:9px 22px; } }

<body>
<div id="app">
  <div id="menuScreen">
    <span class="floatsuit" style="left:6%; top:12%">♠</span><span class="floatsuit" style="right:8%; top:20%; animation-delay:-2s">♥</span><span class="floatsuit" style="left:12%; bottom:10%; animation-delay:-4s">♦</span><span class="floatsuit" style="right:14%; bottom:14%; animation-delay:-1s">♣</span>
    <h1>🃏 トランプコレクション</h1>
    <div class="sub">学校のiPadでも遊べる、定番トランプゲーム集。COMと対戦できます。</div>
    <div class="tiles">
      <button class="tile" data-game="babanuki"><div class="emo">🃏</div><h2>ババ抜き</h2><p>となりの人のカードを引いて、ペアを捨てよう。最後にジョーカーを持っていた人が負け。</p><div class="meta">4人（あなた＋COM×3）</div></button>
      <button class="tile" data-game="shichinarabe"><div class="emo">7️⃣</div><h2>七並べ</h2><p>7の横にカードを並べていく定番ゲーム。パスは3回まで、4回で脱落！</p><div class="meta">4人（あなた＋COM×3）</div></button>
      <button class="tile" data-game="shinkei"><div class="emo">🧠</div><h2>神経衰弱</h2><p>24枚のカードの場所を覚えてペアを取ろう。COMの記憶力は3段階。</p><div class="meta">2人（あなた vs COM）・難易度つき</div></button>
      <button class="tile" data-game="daifugo"><div class="emo">👑</div><h2>大富豪</h2><p>8切り・革命・縛り・スペ3返しなどローカルルール対応。貧民から大富豪を目指せ！</p><div class="meta">4人（あなた＋COM×3）・ルール設定つき</div></button>
    </div>
    <p class="note" style="color:#9fc7ab; margin-top:16px;">遊び方：ゲームを選ぶだけ。あとは画面の指示どおりにタップしてください。</p>

  </div>

  <div id="gameScreen" class="hidden">

      <button id="backBtn">← メニュー</button>

<script type="module">
// トランプゲーム集 共通ロジック＋4ゲーム＋BOT（描画なし・Nodeでも動作）
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SUITS = ['♠', '♥', '♦', '♣'];
const SUIT_NAMES = ['スペード', 'ハート', 'ダイヤ', 'クラブ'];
function cardId(c) { return c.joker ? 'JK' : c.suit + '-' + c.rank; }
function makeDeck(jokers = 0) { const d = []; for (let s = 0; s < 4; s++) for (let r = 1; r <= 13; r++) d.push({ suit: s, rank: r }); for (let i = 0; i < jokers; i++) d.push({ joker: true }); return d; }
function shuffle(deck, rng) { const d = deck.slice(); for (let i = d.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0;[d[i], d[j]] = [d[j], d[i]]; } return d; }
function sortHand(hand) { return hand.slice().sort((a, b) => (a.joker ? 99 : a.suit * 100 + a.rank) - (b.joker ? 99 : b.suit * 100 + b.rank)); }
function removePairs(hand) { // ババ抜き用: 同じ数字のペアを取り除く
  const byRank = new Map(); const rest = [];
  for (const c of hand) { if (c.joker) { rest.push(c); continue; } if (!byRank.has(c.rank)) byRank.set(c.rank, []); byRank.get(c.rank).push(c); }
  const pairs = [];
  for (const [, cs] of byRank) { const n = cs.length - (cs.length % 2); for (let i = 0; i < n; i++) pairs.push(cs[i]); for (let i = n; i < cs.length; i++) rest.push(cs[i]); }
  return { hand: rest, pairs };
}

// ============ ババ抜き ============
function createBabanuki(seed, players = 4) {
  const rng = mulberry32(seed);
  const deck = shuffle(makeDeck(1), rng);
  const hands = Array.from({ length: players }, () => []);
  deck.forEach((c, i) => hands[i % players].push(c));
  const st = { game: 'babanuki', hands: hands.map(h => removePairs(h).hand), turn: 0, ranks: {}, finishedOrder: [], phase: 'play', loser: -1, lastDraw: null };
  st.hands.forEach((h, i) => { if (h.length === 0) { st.ranks[i] = Object.keys(st.ranks).length + 1; st.finishedOrder.push(i); } });
  while (st.hands[st.turn].length === 0) st.turn = (st.turn + 1) % players;
  return st;
}
function babanukiNextWithCards(st, from) { let n = from; do { n = (n + 1) % st.hands.length; } while (st.hands[n].length === 0 && n !== from); return n; }
function babanukiDraw(st, cardIndex) {
  if (st.phase !== 'play') return st;
  const me = st.turn, target = babanukiNextWithCards(st, me);
  if (target === me) { st.phase = 'end'; return st; }
  const card = st.hands[target].splice(cardIndex, 1)[0];
  st.hands[me].push(card);
  st.lastDraw = { from: target, card };
  const before = st.hands[me].length;

function renderHand(cards, opts = {}) {
  const root = $('hand'); root.innerHTML = '';

    const el = cardEl(c);
    const mid = (cards.length - 1) / 2;
    el.style.setProperty('--rot', ((idx - mid) * 1.7).toFixed(2) + 'deg');
    el.style.setProperty('--arc', (Math.pow(idx - mid, 2) * 0.55).toFixed(1) + 'px');
    if (dealAnim) { el.classList.add('deal'); el.style.animationDelay = (idx * 45) + 'ms'; }
    if (idx > 0) el.dataset.baseMargin = '1';
    if (selected.has(G.cardId(c))) { el.classList.add('sel'); const b = document.createElement('div'); b.className = 'selbadge'; b.textContent = '✓'; el.appendChild(b); }
    if (opts.legalIds && opts.legalIds.has(G.cardId(c))) el.classList.add('legal');
    if (opts.dimIds && opts.dimIds.has(G.cardId(c))) el.classList.add('dim');
    if (shakeId === G.cardId(c)) el.classList.add('shake');
    el.onclick = () => opts.onTap && opts.onTap(c, idx, el);
    root.appendChild(el);
  });

  const els = [...root.children];
  if (els.length > 1) {
    const cw = els[0].offsetWidth || 64;
    const avail = (root.clientWidth || window.innerWidth) - 6;
    let strip = Math.min(cw * 0.85, Math.max(20, (avail - cw) / (els.length - 1)));
    els.forEach((el, i) => { if (i === 0) return; let m = -(cw - strip); if (opts.groupRanks) { const prev = cards[i - 1], c = cards[i]; m += (!c.joker && !prev.joker && c.rank === prev.rank) ? -5 : 3; } el.style.marginLeft = m + 'px'; });
  }
}
function shakeCard(id) { shakeId = id; render(); setTimeout(() => { shakeId = null; render(); }, 330); }
// 指で手札をなぞると、カードが波のように持ち上がる
(function initWave() {
  const hand = $('hand');
  const setWave = clientX => {
    const els = [...hand.children];
    if (!els.length) return;
    let f = -1, best = 1e9;
    els.forEach((el, i) => { const r = el.getBoundingClientRect(); const cx = r.left + r.width / 2; const d = Math.abs(clientX - cx); if (d < best) { best = d; f = i + (clientX < cx ? 0 : 0); } });
    els.forEach((el, i) => { const dist = Math.abs(i - f); const lift = dist >= 2 ? 0 : -30 * Math.cos(dist / 2 * Math.PI / 2); el.style.setProperty('--wave', lift.toFixed(1) + 'px'); });
  };
  const clear = () => [...hand.children].forEach(el => el.style.setProperty('--wave', '0px'));
  hand.addEventListener('pointermove', e => { if (e.pointerType !== 'mouse' || e.buttons) setWave(e.clientX); else if (e.pointerType === 'mouse') setWave(e.clientX); });
  hand.addEventListener('pointerdown', e => setWave(e.clientX));
  hand.addEventListener('pointerup', clear);
  hand.addEventListener('pointerleave', clear);
  hand.addEventListener('pointercancel', clear);
})();

// ---------- ゲーム別描画・進行 ----------
function render() {
  if (!st) return;
  if (game === 'babanuki') renderBabanuki();
  if (game === 'shichinarabe') renderShichinarabe();
  if (game === 'shinkei') renderShinkei();
  if (game === 'daifugo') renderDaifugo();
}
async function driveBots() {
  if (busy || !st) return; busy = true;
  const my = session;
  try {
    while (st && session === my && st.phase === 'play' && st.turn !== 0) {
      await sleep(botWait);
      if (!st || session !== my || st.phase !== 'play') break;
      let plannedDaifugo = null;
      if (game === 'daifugo') { // 演出と実際の着手で同じCOM判断を使用する
        const mv = plannedDaifugo = G.botDaifugo(st, st.turn);
        if (mv.type === 'play') { const opps = document.querySelectorAll('#opponents .opp'); const src = opps[st.turn - 1]; if (src) { flyTo(src, $('center').getBoundingClientRect(), null); await sleep(235); } }
      }
      if (!st || session !== my || st.phase !== 'play') break;
      botStep(plannedDaifugo);
      checkFx();
      render();
      if (st.phase === 'end') { showResult(); break; }
    }
  } finally { if (session === my) busy = false; setTimeout(kickBots, 60); }
}
function kickBots() { // 進行ループが止まっていたら再始動する（画面遷移で中断された場合の復帰）
  if (!st || st.phase !== 'play') return;
  if (game === 'shinkei') { if (st.turn === 1) shinkeiBotTurn(); }
  else if (st.turn !== 0) driveBots();
}
function flyTo(fromEl, toRect, card, delay = 0) { // カードが飛ぶ演出（実DOMはそのまま、複製だけを飛ばす）
  const r = fromEl.getBoundingClientRect();
  const clone = cardEl(card);
  clone.style.cssText = `position:fixed; left:${r.left}px; top:${r.top}px; width:${r.width}px; height:${r.height}px; z-index:60; pointer-events:none; margin:0;`;
  document.body.appendChild(clone);
  const dx = (toRect.left + toRect.width / 2) - (r.left + r.width / 2), dy = (toRect.top + toRect.height / 2) - (r.top + r.height / 2);
  clone.animate([{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${dx}px, ${dy}px) scale(.94)`, opacity: .96 }], { duration: 235, delay, easing: 'cubic-bezier(0.16,1,0.3,1)', fill: 'forwards' });
  setTimeout(() => clone.remove(), 235 + delay + 80);
}
function showBubble(playerIdx, text) {
  // render()で対戦相手DOMが再生成されるため、次のイベントループで吹き出しを置く
  if (!text) return;
  const currentSession = session;
  setTimeout(() => {
    if (session !== currentSession) return;
    const opps = document.querySelectorAll('#opponents .opp');
    const idx = game === 'shinkei' ? 0 : playerIdx - 1;
    const el = opps[idx];
    if (!el) return;
    const b = document.createElement('div');
    b.className = 'bubble'; b.textContent = text; el.appendChild(b);
    setTimeout(() => b.remove(), 1500);
  }, 0);
}
function botStep(plannedDaifugo = null) {
  if (game === 'babanuki') { const drawer = st.turn; G.babanukiDraw(st, G.botBabanuki(st)); showBubble(drawer, st.lastDraw && st.lastDraw.paired ? 'ペアそろった！' : '引いた'); }
  if (game === 'shichinarabe') { const p = st.turn; const m = G.botShichinarabe(st); if (m.type === 'pass') { G.shichinarabePass(st); showBubble(p, st.out[p] ? '脱落…' : 'パス'); } else { G.shichinarabePlay(st, m.id); showBubble(p, '出した'); } }
  if (game === 'daifugo') { const p = st.turn; const m = plannedDaifugo || G.botDaifugo(st, p); if (m.type === 'pass') { G.daifugoPass(st, p); showBubble(p, 'パス'); } else { G.daifugoPlay(st, p, m.cards); const ev = st.lastEvent || ''; showBubble(p, ev.includes('革命') ? '革命！' : ev.includes('反則') ? '反則…' : ev.includes('上がり') ? '上がり！' : (st.field === null && ev.includes('8切り')) || (m.cards.some(cd => !cd.joker && cd.rank === 8) && st.cfg.eightCut && st.field === null) ? '8切り！' : '出した'); } }
  if (game === 'shinkei') { const a = G.botShinkei(st); G.shinkeiFlip(st, a); render(); }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
function banner(text) { const b = $('banner'); b.innerHTML = `<div class="btxt">${text}</div>`; setTimeout(() => { if (b) b.innerHTML = ''; }, 1200); }
let prevRev = false;

function confetti() { const wrap = document.querySelector('.modalWrap'); if (!wrap) return; const colors = ['#ffd94a', '#ff6b81', '#57d7ff', '#8be08b', '#ffffff']; for (let i = 0; i < 30; i++) { const d = document.createElement('div'); d.className = 'confetti'; d.style.left = (Math.random() * 100) + '%'; d.style.background = colors[i % colors.length]; d.style.animationDelay = (Math.random() * 0.7) + 's'; d.style.transform = `rotate(${Math.random() * 360}deg)`; wrap.appendChild(d); setTimeout(() => d.remove(), 3600); } }

  st.board.forEach((b, i) => {
    const faceUp = st.flipped.includes(i) || (holdPair && holdPair.includes(i));
    const el = faceUp || b.taken ? cardEl(b.card) : cardEl(null);
    if (faceUp) el.classList.add('flipanim');
    if (b.taken) { if (justTaken.has(i)) el.classList.add('justtaken'); else if (!faceUp) el.classList.add('taken'); }
    el.onclick = () => shinkeiPlayerFlip(i);
    grid.appendChild(el);
  });
  $('handLabel').textContent = ''; $('hand').innerHTML = ''; actions([]);
  msg(st.phase === 'end' ? '' : st.turn === 0 ? 'あなたの番：2枚めくろう' : 'COMの番…');
  if (st.phase === 'end') showResult();
}
async function shinkeiPlayerFlip(i) {
  if (busy || !st || st.turn !== 0 || st.phase !== 'play') return;
  const before = st.flipped.length;
  G.shinkeiFlip(st, i);
  if (st.flipped.length === before && !st.lastPair) { render(); return; }
  if (st.lastPair && st.flipped.length === 0) { // 2枚目をめくった直後
    holdPair = st.lastPair.positions; const wasMatch = st.board[holdPair[0]].taken; st.lastPair = null; render();
    busy = true; const myF = session; await sleep(wasMatch ? 420 : 950); if (session !== myF || !st) return;
    if (wasMatch) { justTaken = new Set(holdPair); holdPair = null; render(); await sleep(390); justTaken = new Set(); }
    holdPair = null; busy = false; render();
    if (st.phase === 'end') { showResult(); return; }
    if (st.turn === 1) shinkeiBotTurn();
    return;
  }
  render();
}
async function shinkeiBotTurn() {
  if (busy || !st || game !== 'shinkei' || st.phase !== 'play' || st.turn !== 1) return;
  busy = true;
  const my = session;
  while (st && session === my && game === 'shinkei' && st.phase === 'play' && st.turn === 1) {
    await sleep(650);
    if (!st || session !== my || game !== 'shinkei') break;
    const a = G.botShinkei(st); G.shinkeiFlip(st, a); render();
    await sleep(650);
    if (!st || session !== my || game !== 'shinkei' || st.phase !== 'play') break;
    const b = G.botShinkei(st); G.shinkeiFlip(st, b);
    if (st.lastPair) { holdPair = st.lastPair.positions; const wasMatch = st.board[holdPair[0]].taken; st.lastPair = null; render(); await sleep(wasMatch ? 420 : 950); if (wasMatch && session === my) { justTaken = new Set(holdPair); holdPair = null; render(); await sleep(390); justTaken = new Set(); } holdPair = null; }
    render();
  }
  if (session !== my) return;
  busy = false;
  if (st && st.phase === 'end') showResult();
  else setTimeout(kickBots, 60);
}
// 大富豪
function daifugoSelReason(selCards, legalKeys) {
  if (!selCards.length) return null;
  const key = selCards.map(G.cardId).sort().join(',');
  if (legalKeys.has(key)) return { ok: true };
  const nonJ = selCards.filter(c => !c.joker);
  const ranks = new Set(nonJ.map(c => c.rank));
  if (nonJ.length && ranks.size > 1) return { ok: false, text: '同じ数字でそろえてね' };
  const f = st.field;
  if (f && selCards.length !== f.count) return { ok: false, text: `場は${f.count}枚。${f.count}枚で出してね` };
  if (f && st.cfg.suitLock && f.lockSuits) return { ok: false, text: '縛り中：場と同じスートで出してね' };
  if (f) { const rev = st.revolution !== (f.tempReverse || false); return { ok: false, text: rev ? '革命中：場より弱いカードを出してね' : '場より強いカードが必要だよ' }; }
  return { ok: false, text: 'その組み合わせでは出せないよ' };
}
function renderDaifugo() {
  renderOpponents(4, i => st.finished.includes(i) ? '上がり' : `${st.hands[i].length}枚`);
  const c = $('center');
  const tags = [];
  if (st.revolution) tags.push('🔥革命中');
  if (st.field?.tempReverse) tags.push('🔃イレブンバック中');
  if (st.field?.lockSuits) tags.push('🔒スート縛り');
  if (!st.field) {
    c.innerHTML = `<div style="text-align:center"><div style="color:#ffe9a8; margin-bottom:6px">${tags.join(' ')} ${st.lastEvent || ''}</div><div style="color:#cfe9d6">${st.turn === 0 ? '好きなカードを出せるよ（リード）' : NAMES[st.turn] + ' が出す番'}</div></div>`;
    if (prevFieldCards && st.phase === 'play') { const ghost = document.createElement('div'); ghost.className = 'fieldcards ghost'; prevFieldCards.forEach(cd => ghost.appendChild(cardEl(cd, 'small'))); c.querySelector('div').appendChild(ghost); setTimeout(() => ghost.remove(), 360); }
  } else {
    const wrap = document.createElement('div');
    wrap.style.textAlign = 'center';
    wrap.innerHTML = `<div style="color:#ffe9a8; margin-bottom:6px">${tags.join(' ')}</div><div class="fieldcards"></div><div style="color:#cfe9d6; margin-top:6px">${NAMES[st.field.lastPlayer]} が出した（${st.field.count}枚）／${st.lastEvent || ''}</div>`;
    const fc = wrap.querySelector('.fieldcards');
    st.field.cards.forEach(cd => { const e = cardEl(cd, 'small'); e.classList.add('pop'); fc.appendChild(e); });
    c.innerHTML = ''; c.appendChild(wrap);
  }
  prevFieldCards = st.field ? st.field.cards : null;
  const myTurn = st.turn === 0 && st.phase === 'play';
  const legal = myTurn ? G.daifugoLegalMoves(st, 0) : [];
  const legalKeys = new Set(legal.map(m => m.map(G.cardId).sort().join(',')));
  const legalCardIds = new Set(legal.flat().map(G.cardId));
  const selCards = st.hands[0].filter(cd => selected.has(G.cardId(cd)));
  const reason = myTurn ? daifugoSelReason(selCards, legalKeys) : null;
  const sortedHand = st.hands[0].slice().sort((a, b) => G.rankValue(a) - G.rankValue(b) || (a.joker ? 9 : a.suit) - (b.joker ? 9 : b.suit));
  $('handLabel').textContent = myTurn ? 'あなたの番' : `${NAMES[st.turn]} の番`;
  msg(st.revolution ? '革命中！ 弱いカードほど強い' : '');
  renderHand(sortedHand, {
    legalIds: myTurn ? legalCardIds : new Set(),
    dimIds: myTurn ? new Set(st.hands[0].filter(cd => !legalCardIds.has(G.cardId(cd))).map(G.cardId)) : new Set(),
    groupRanks: true,
    onTap: cd => { if (!myTurn) return; const id = G.cardId(cd); if (!legalCardIds.has(id)) { shakeCard(id); return; } if (selected.has(id)) selected.delete(id); else selected.add(id); render(); }
  });
  const info = $('selInfo');
  if (myTurn) {
    if (!selCards.length) info.innerHTML = 'カードを選んでね（明るいカードが出せるよ）';
    else if (reason && reason.ok) { const info2 = G.comboInfo(selCards, st); const extra = []; if (st.cfg.eightCut && info2.has8) extra.push('8切り！'); if (st.cfg.revolution && info2.count >= 4) extra.push(st.revolution ? '革命鎮圧！' : '革命！'); if (st.hands[0].length === selCards.length) extra.push('上がり！'); info.innerHTML = `<span class="ok">選択中 ${selCards.length}枚：出せる！</span> ${extra.join(' ')}`; }
    else info.innerHTML = `<span class="ng">選択中 ${selCards.length}枚：${reason ? reason.text : ''}</span>`;
  } else info.textContent = '';
  actions(myTurn ? [
    { label: '出す', disabled: !(reason && reason.ok), onClick: async () => { if (busy) return; busy = true; const currentSession = session; const cs = st.hands[0].filter(cd => selected.has(G.cardId(cd))); const els = [...document.querySelectorAll('#hand .card.sel')]; const centerRect = $('center').getBoundingClientRect(); els.forEach((el, i) => flyTo(el, centerRect, cs[i], i * 45)); await sleep(250 + cs.length * 45); if (session !== currentSession) return; selected.clear(); G.daifugoPlay(st, 0, cs); busy = false; checkFx(); render(); if (st.phase === 'end') showResult(); else driveBots(); } },
    ...(st.field ? [{ label: 'パス', sub: true, onClick: () => { selected.clear(); G.daifugoPass(st, 0); render(); if (st.phase === 'end') showResult(); else driveBots(); } }] : []),
    ...(selCards.length ? [{ label: 'すべて解除', sub: true, onClick: () => { selected.clear(); render(); } }] : []),
  ] : []);
  if (st.phase === 'end') showResult();
}
$('verLabel').textContent = 'v' + TC_VERSION;
// ===== テスト/検証用フック（画面の見た目に依存せず状態と操作を直接扱う） =====
window.TC = {
  version: TC_VERSION,
  setFast(on) { botWait = on ? 110 : 780; },
  get state() { return st; },
  get game() { return game; },
  start(g) { startGame(g); const b = $('mStart'); if (b) b.click(); },
  legal() {
    if (!st || st.phase !== 'play' || st.turn !== 0) return [];
    if (game === 'daifugo') return G.daifugoLegalMoves(st, 0).map(m => m.map(G.cardId));
    if (game === 'shichinarabe') return G.shichinarabeLegal(st.hands[0], st.placed).map(c => [G.cardId(c)]);
    if (game === 'babanuki') return [['draw']];
    if (game === 'shinkei') return st.board.map((b, i) => i).filter(i => !st.board[i].taken && !st.flipped.includes(i)).map(i => [i]);
    return [];
  },
  act(a) {
    if (!st) return false;
    if (game === 'daifugo') {
      if (a.type === 'pass') { G.daifugoPass(st, 0); }
      else { const cs = st.hands[0].filter(cd => a.ids.includes(G.cardId(cd))); G.daifugoPlay(st, 0, cs); checkFx(); }
      render(); if (st.phase === 'end') showResult(); else driveBots(); return true;
    }
    if (game === 'shichinarabe') {
      if (a.type === 'pass') G.shichinarabePass(st); else G.shichinarabePlay(st, a.ids[0]);
      render(); if (st.phase === 'end') showResult(); else driveBots(); return true;
    }
    if (game === 'babanuki') { G.babanukiDraw(st, a.index || 0); render(); if (st.phase === 'end') showResult(); else driveBots(); return true; }
    if (game === 'shinkei') { shinkeiPlayerFlip(a.pos); return true; }
    return false;
  },
};
showMenu();
