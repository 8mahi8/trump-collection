</section><script>
// トランプゲーム集 共通ロジック＋4ゲーム＋BOT（描画なし・Nodeでも動作）
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const SUITS = ['♠', '♥', '♦', '♣'];
const SUIT_NAMES = ['スペード', 'ハート', 'ダイヤ', 'クラブ'];
function cardId(c) { return c.joker ? 'JK' : c.suit + '-' + c.rank; }
function makeDeck(jokers = 0) { const d = []; for (let s = 0; s < 4; s++) for (let r = 1; r <= 13; r++) d.push({ suit: s, rank: r }); for (let i = 0; i < jokers; i++) d.push({ joker: true }); return d; }
function shuffle(deck, rng) { const d = deck.slice(); for (let i = d.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0;[d[i], d[j]] = [d[j], d[i]]; } return d; }
function sortHand(hand) { return hand.slice().sort((a, b) => (a.joker ? 99 : a.suit * 100 + a.rank) - (b.joker ? 99 : b.suit * 100 + b.rank)); }
function removePairs(hand) { // ババ抜き用: 同じ数字のペアを取り除く
  const byRank = new Map(); const rest = [];
  for (const c of hand) { if (c.joker) { rest.push(c); continue; } if (!byRank.has(c.rank)) byRank.set(c.rank, []); byRank.get(c.rank).push(c); }
  const pairs = [];
  for (const [, cs] of byRank) { const n = cs.length - (cs.length % 2); for (let i = 0; i < n; i++) pairs.push(cs[i]); for (let i = n; i < cs.length; i++) rest.push(cs[i]); }
  return { hand: rest, pairs };
}

// ============ ババ抜き ============
function createBabanuki(seed, players = 4) {
  const rng = mulberry32(seed);
  const deck = shuffle(makeDeck(1), rng);
  const hands = Array.from({ length: players }, () => []);
  deck.forEach((c, i) => hands[i % players].push(c));
  const st = { game: 'babanuki', hands: hands.map(h => removePairs(h).hand), turn: 0, ranks: {}, finishedOrder: [], phase: 'play', loser: -1, lastDraw: null };
  st.hands.forEach((h, i) => { if (h.length === 0) { st.ranks[i] = Object.keys(st.ranks).length + 1; st.finishedOrder.push(i); } });
  while (st.hands[st.turn].length === 0) st.turn = (st.turn + 1) % players;
  return st;
}
function babanukiNextWithCards(st, from) { let n = from; do { n = (n + 1) % st.hands.length; } while (st.hands[n].length === 0 && n !== from); return n; }
function babanukiDraw(st, cardIndex) {

  const me = st.turn, target = babanukiNextWithCards(st, me);
  if (target === me) { st.phase = 'end'; return st; }

  const card = st.hands[target].splice(cardIndex, 1)[0];
  st.hands[me].push(card);
  st.lastDraw = { from: target, by: me, card };
  const before = st.hands[me].length;
  st.hands[me] = removePairs(st.hands[me]).hand;
  const paired = st.hands[me].length < before;
  st.lastDraw.paired = paired;
  for (const p of [target, me]) if (st.hands[p].length === 0 && st.ranks[p] === undefined) { st.ranks[p] = Object.keys(st.ranks).length + 1; st.finishedOrder.push(p); }
  const alive = st.hands.map((h, i) => ({ h, i })).filter(o => o.h.length > 0);
  if (alive.length <= 1) { st.phase = 'end'; st.loser = alive.length ? alive[0].i : -1; if (st.loser >= 0) st.ranks[st.loser] = st.hands.length; return st; }

}
function botBabanuki(st) { const target = babanukiNextWithCards(st, st.turn); return (Math.random() * st.hands[target].length) | 0; }

// ============ 七並べ ============
function createShichinarabe(seed, players = 4) {
  const rng = mulberry32(seed);
  const deck = shuffle(makeDeck(0), rng);
  const hands = Array.from({ length: players }, () => []);
  deck.forEach((c, i) => hands[i % players].push(c));
  const st = { game: 'shichinarabe', hands, placed: [null, null, null, null].map(() => ({ low: 8, high: 6 })), pending: [], turn: 0, passes: Array(players).fill(0), ranks: {}, out: Array(players).fill(false), phase: 'play', lastAction: null };

}
function shichinarabeAutoPlace(st) { // pending（脱落者のカード）が隣接したら自動で並べる
  let moved = true;
  while (moved) { moved = false; st.pending = st.pending.filter(c => { const pl = st.placed[c.suit]; if (c.rank === pl.low - 1) { pl.low = c.rank; moved = true; return false; } if (c.rank === pl.high + 1) { pl.high = c.rank; moved = true; return false; } return true; }); }
}
function shichinarabeLegal(hand, placed) { return hand.filter(c => c.rank === placed[c.suit].low - 1 || c.rank === placed[c.suit].high + 1); }
function shichinarabePlay(st, id) {
  if (st.phase !== 'play') return st;
  const p = st.turn, idx = st.hands[p].findIndex(c => cardId(c) === id);
  if (idx < 0) return st;
  const c = st.hands[p][idx], pl = st.placed[c.suit];
  if (!(c.rank === pl.low - 1 || c.rank === pl.high + 1)) return st;
  st.hands[p].splice(idx, 1);
  if (c.rank === pl.low - 1) pl.low = c.rank; else pl.high = c.rank;
  st.lastAction = { player: p, type: 'play', card: c };
  shichinarabeAutoPlace(st);
  if (st.hands[p].length === 0 && st.ranks[p] === undefined) { st.ranks[p] = Object.keys(st.ranks).length + 1; }
  shichinarabeAdvance(st);
  return st;
}
function shichinarabePass(st) {
  if (st.phase !== 'play') return st;
  const p = st.turn;
  st.passes[p]++;
  st.lastAction = { player: p, type: 'pass', count: st.passes[p] };
  if (st.passes[p] >= 4 && !st.out[p]) { // 4回目のパスで脱落：手札は pending へ
    st.out[p] = true; st.pending.push(...st.hands[p]); st.hands[p] = [];
    st.ranks[p] = 99; // 暫定（最後に最下位へ）

}
function shichinarabeAdvance(st) {
  const total = st.hands.length;
  const remaining = st.hands.map((h, i) => i).filter(i => !st.out[i] && st.hands[i].length > 0);
  if (remaining.length <= 1) { st.phase = 'end'; // 順位の正規化: 上がり順 → 最後まで残った人 → 脱落者
    const order = [];
    Object.entries(st.ranks).filter(([, v]) => v !== 99).sort((a, b) => a[1] - b[1]).forEach(([k]) => order.push(Number(k)));
    remaining.forEach(i => { if (!order.includes(i)) order.push(i); });
    st.hands.forEach((h, i) => { if (st.out[i] && !order.includes(i)) order.push(i); });
    order.forEach((p, idx) => st.ranks[p] = idx + 1);
    return;
  }
  let n = st.turn;
  do { n = (n + 1) % total; } while (st.out[n] || st.hands[n].length === 0);

}
function botShichinarabe(st) {
  const p = st.turn, hand = st.hands[p];
  const legal = shichinarabeLegal(hand, st.placed);
  if (!legal.length) return { type: 'pass' };
  // 次の手番でも出せる自分の連番を多く開く。相手の非公開カードは参照しない。
  const score = c => {
    const step = c.rank < 7 ? -1 : 1;
    let chain = 0;
    for (let rank = c.rank + step; rank >= 1 && rank <= 13; rank += step) {
      if (hand.some(x => x.suit === c.suit && x.rank === rank)) chain++;
      else break;
    }
    return chain * 10 + hand.filter(x => x.suit === c.suit).length * 0.2;
  };
  legal.sort((a, b) => score(b) - score(a));
  // 意図的なパスは2000試合の比較で成績が悪化したため導入しない。
  return { type: 'play', id: cardId(legal[0]) };

// ============ 神経衰弱 ============
function createShinkei(seed, difficulty = 1) {
  const rng = mulberry32(seed);
  const cards = [];
  for (let s = 0; s < 4; s++) for (let r = 1; r <= 6; r++) cards.push({ suit: s, rank: r });
  const board = shuffle(cards, rng).map(c => ({ card: c, taken: false }));
  return { game: 'shinkei', board, turn: 0, scores: [0, 0], flipped: [], phase: 'play', winner: -1, difficulty, memory: new Map(), lastResult: null, lastPair: null };
}
function shinkeiObserve(st, pos) { const c = st.board[pos].card; st.memory.set(pos, c.suit + '-' + c.rank); if (st.difficulty === 0 && st.memory.size > 6) { const k = st.memory.keys().next().value; st.memory.delete(k); } if (st.difficulty === 1 && st.memory.size > 14) { const k = st.memory.keys().next().value; st.memory.delete(k); } }
function shinkeiFlip(st, pos) {
  if (st.phase !== 'play' || !Number.isInteger(pos) || pos < 0 || pos >= st.board.length || st.board[pos].taken || st.flipped.includes(pos) || st.flipped.length >= 2) return st;
  st.flipped.push(pos); shinkeiObserve(st, pos);
  if (st.flipped.length === 2) {
    const [a, b] = st.flipped, ca = st.board[a].card, cb = st.board[b].card;
    st.lastPair = { positions: [a, b] };
    if (ca.rank === cb.rank) { st.board[a].taken = st.board[b].taken = true; st.scores[st.turn]++; st.memory.delete(a); st.memory.delete(b); st.lastResult = { match: true, player: st.turn }; st.flipped = []; }
    else { st.lastResult = { match: false, player: st.turn }; st.flipped = []; st.turn = 1 - st.turn; if (st.difficulty === 0) { /* 弱いCOMは見たカードをよく忘れる */ for (const k of [...st.memory.keys()]) if (Math.random() < 0.4) st.memory.delete(k); } }
    if (st.board.every(x => x.taken)) { st.phase = 'end'; st.winner = st.scores[0] === st.scores[1] ? -1 : (st.scores[0] > st.scores[1] ? 0 : 1); }
  }

function botShinkei(st) {

  const known = [...st.memory.entries()].filter(([pos]) => !st.board[pos].taken);
  if (st.flipped.length === 0) {
    const byRank = new Map();
    for (const [pos, key] of known) { const r = key.split('-')[1]; if (!byRank.has(r)) byRank.set(r, []); byRank.get(r).push(pos); }

  }

  const matchPos = known.find(([pos, key]) => pos !== st.flipped[0] && key.split('-')[1] === String(first.rank));
  if (matchPos) return matchPos[0];

// ============ 大富豪 ============
const DAIFUGO_DEFAULTS = { eightCut: true, revolution: true, suitLock: true, spade3: true, elevenBack: true, foulFinish: true, tribute: true };
function rankValue(c) { if (c.joker) return 13; return c.rank === 1 ? 11 : c.rank === 2 ? 12 : c.rank - 3; } // 3=0 … K=10, A=11, 2=12, JOKER=13
function createDaifugo(seed, cfg = DAIFUGO_DEFAULTS, prevRanks = null) {
  const rng = mulberry32(seed);
  const deck = shuffle(makeDeck(1), rng);
  const hands = [[], [], [], []];
  deck.forEach((c, i) => hands[i % 4].push(c));
  const st = { game: 'daifugo', cfg, hands, turn: 0, field: null, revolution: false, ranks: {}, finished: [], fouls: [], phase: 'play', lastEvent: 'ゲーム開始', passStreak: 0, leader: 0, tributeLog: [] };
  if (prevRanks && cfg.tribute) { // 献上: 大貧民→大富豪2枚 / 貧民→富豪1枚（自動で最強を渡し、最弱を受け取る）
    const order = Object.entries(prevRanks).sort((a, b) => a[1] - b[1]).map(([k]) => Number(k)); // [大富豪, 富豪, 貧民, 大貧民]
    const exch = (from, to, n) => { const fh = hands[from].sort((a, b) => rankValue(b) - rankValue(a)); const give = fh.splice(0, n); const th = hands[to].sort((a, b) => rankValue(a) - rankValue(b)); const back = th.splice(0, n); hands[from].push(...back); hands[to].push(...give); st.tributeLog.push(`${from}→${to} ${n}枚`); };
    exch(order[3], order[0], 2); exch(order[2], order[1], 1);
    st.turn = order[0]; st.leader = order[0];
  } else { const d3 = hands.findIndex(h => h.some(c => c.suit === 2 && c.rank === 3)); st.turn = d3 >= 0 ? d3 : 0; st.leader = st.turn; }

}
function combosOf(hand) { // 同じ数字のあらゆるスートの組み合わせを列挙
  const groups = new Map(); let joker = null;
  for (const c of hand) { if (c.joker) { joker = c; continue; } if (!groups.has(c.rank)) groups.set(c.rank, []); groups.get(c.rank).push(c); }
  const out = [];
  if (joker) out.push([joker]);
  for (const [, cs] of groups) {

    for (let mask = 1; mask < (1 << cs.length); mask++) {
      const subset = cs.filter((_, i) => (mask & (1 << i)) !== 0);

function comboInfo(cards, st) {

  const value = cards.length === 1 && cards[0].joker ? 99 : rankValue(nonJ[0]);

function daifugoLegalMoves(st, p) {
  const hand = st.hands[p], cfg = st.cfg, f = st.field;
  let moves = combosOf(hand);

  const rev = st.revolution !== (f.tempReverse || false); // 実効の反転状態（革命 XOR イレブンバック）
  moves = moves.filter(cs => {
    if (cs.length !== f.count) return false;
    const info = comboInfo(cs, st);

      const extra = [...info.suits].filter(s => !f.lockSuits.has(s)).length;
      const missing = [...f.lockSuits].filter(s => !info.suits.has(s)).length;
      if (extra > 0 || missing > (info.hasJoker ? 1 : 0)) return false;
    }
    if (f.value === 99) return false; // ジョーカー単体にはスペ3以外出せない
    if (info.value === 99) return true;
    return rev ? info.value < f.value : info.value > f.value;

}
function daifugoPlay(st, p, cards) {
  if (st.phase !== 'play' || st.turn !== p) return st;
  const legal = daifugoLegalMoves(st, p);
  const ids = cards.map(cardId).sort().join(',');
  const ok = legal.some(m => m.map(cardId).sort().join(',') === ids);
  if (!ok) return st;
  const info = comboInfo(cards, st);
  const prevField = st.field;
  const spade3Clear = !!(st.cfg.spade3 && prevField?.isJokerSingle && cards.length === 1 && !cards[0].joker && cards[0].suit === 0 && cards[0].rank === 3);

   }
  }
  entries.sort((a,b)=>a.sentAt-b.sentAt||a.uid.localeCompare(b.uid)||a.seq-b.seq);
  const log=$('chatList'),bottom=log.scrollHeight-log.scrollTop-log.clientHeight<28;
  log.replaceChildren();
  for(const m of entries.slice(-40)){
   const line=document.createElement('div');line.className='chat-msg';
   const author=document.createElement('span');author.className='chat-name';
   author.textContent=m.uid===store.uid?'自分':'友達 '+m.uid.slice(-3);
   const content=document.createElement('span');content.textContent=m.text;
   line.append(author,content);log.appendChild(line);
  }
  if(bottom)log.scrollTop=log.scrollHeight;
  $('chatStatus').textContent='';
 }catch(e){
  if(epoch===session&&chatOpen)$('chatStatus').textContent='チャットを取得できません：'+describe(e);
 }finally{chatLoading=false;}
}
async function sendChat(event){
 event.preventDefault();
 const text=$('chatInput').value.trim();
 if(!text||text.length>120||chatSending||!store||!roomCode||mySeat<0)return;
 if(!online){$('chatStatus').textContent='通信の復帰を待っています';return;}
 const epoch=session,room=roomCode;
 chatSending=true;$('chatSend').disabled=true;
 try{
  await store.sendChat(room,text,++chatSeq);
  if(epoch!==session||room!==roomCode)return;
  $('chatInput').value='';chatLastPoll=0;
  await refreshChat();
 }catch(e){
  if(epoch===session)$('chatStatus').textContent='送信できません：'+describe(e);
 }finally{chatSending=false;$('chatSend').disabled=false;}
}
$('chatToggle').onclick=()=>setChatOpen(!chatOpen);
$('chatClose').onclick=()=>setChatOpen(false);
$('chatCompose').onsubmit=sendChat;
function appendText(parent,text,className=''){
 const item=document.createElement('span');item.textContent=text;if(className)item.className=className;parent.appendChild(item);return item;
}
function button(text,fn,disabled=false,cls=''){
 const b=document.createElement('button');b.type='button';b.textContent=text;b.disabled=disabled;
 if(cls)b.className=cls;if(fn)b.onclick=fn;
 return b;
}
function card(c,clickable=false,click=null){
 const b=button(cardText(c),click,!clickable,'card'+((c?.suit===1||c?.suit===2)?' red':''));
 return b;
}
function render(){
 if(!publicState){
  $('ready').disabled=$('start').disabled=true;
  return;
 }
 const v=publicState,p=mySeat,acting=v.phase==='playing'&&v.turn===p;
 const key=[v.round,v.revision,p,busy,pendingAction,online,[...selected].sort().join(',')].join('|');
 if(key===lastRender)return;lastRender=key;
 const usable=online&&!busy&&!pendingAction&&p>=0;
 $('roomCode').textContent=roomCode;
 $('role').textContent='｜'+(isHost?'ホスト':'ゲスト')+' / '+(p>=0?'席 '+(p+1):'入室待ち');
 $('roster').textContent='｜'+v.seats.filter(s=>s.present).length+'/4人';
 $('ready').disabled=!usable||v.phase!=='lobby';
 $('ready').textContent=v.seats[p]?.ready?'準備を解除':'準備OK';
 $('start').hidden=!isHost;
 $('start').disabled=!usable||v.phase!=='lobby'||!v.seats.every(s=>s.ready);
 $('rematch').hidden=!isHost||v.phase!=='finished';
 $('rematch').disabled=!usable;
 $('match').hidden=v.phase==='lobby';
 const state=$('state'),board=$('board'),hand=$('hand'),actions=$('actions');
 board.replaceChildren();hand.replaceChildren();actions.replaceChildren();
 state.textContent=GAMES[game]+'｜'+(v.phase==='finished'?'結果':acting?'あなたの番':'相手の番')+
  '｜手札 '+(v.counts||[]).join(' / ')+'｜通信 '+(online?'OK':'再接続中');
 setupInfo(v.phase==='lobby'?'4人が準備したらホストが開始します':v.phase==='finished'?'対戦終了！ 再戦できます':acting?'カードを選んで操作してね':'相手の操作を待っています');
 if(v.phase==='finished'){
  appendText(actions,'順位： '+Object.entries(v.ranks||{}).sort((a,b)=>a[1]-b[1]).map(([seat,r])=>(Number(seat)===p?'自分':'席'+(Number(seat)+1))+' '+r+'位').join(' / '));
 }
 if(v.phase!=='playing'&&v.phase!=='finished')return;
 if(game==='babanuki'){
  appendText(board,'引く相手：席'+(Number(v.drawFrom)+1)+'　','mini');
  if(acting&&usable&&v.drawFrom!==p&&v.counts[v.drawFrom]>0){
   for(let i=0;i<v.counts[v.drawFrom];i++)board.appendChild(button('🂠',()=>send('draw',{index:i}),false,'card back'));
  }else appendText(board,acting?'操作待ち':'相手の手番です','muted');
  if(privateState?.lastDraw?.card)appendText(board,' 引いた：'+cardText(privateState.lastDraw.card)+(privateState.lastDraw.paired?'（ペア成立）':''));
 }else if(game==='shichinarabe'){
  const placed=v.placed||[];
  for(let suit=0;suit<4;suit++){
   const line=document.createElement('div');line.className='board-line';
   appendText(line,UI_SUITS[suit]+' ','mini');
   for(let rank=1;rank<=13;rank++){
    const inField=placed[suit]&&rank>=placed[suit].low&&rank<=placed[suit].high;
    appendText(line,inField?(CARD_NAMES[rank]||rank)+'':'·',inField?'field-card':'field-empty');
   }
   board.appendChild(line);
  }
  // Like COM mode, selecting a card must never send it immediately.
  // Requiring an explicit confirmation avoids accidental touches on iPad.
  const pick=[...selected][0];
  const canConfirm=selected.size===1&&(privateState?.legalIds||[]).includes(pick);
  actions.appendChild(button('選択カードを出す',()=>{
   const id=[...selected][0];selected.clear();
   send('play',{id});
  },!usable||!acting||!canConfirm));
  appendText(actions,canConfirm?' 選択したカードを確定できます':' 出したいカードを選んでね','mini');
  actions.appendChild(button('パス',()=>{selected.clear();send('pass');},!usable||!acting));
 }else if(game==='daifugo'){
  appendText(board,'場：'+(v.field?.cards?.map(cardText).join(' / ')||'なし')+(v.revolution?' ｜革命中！':''),'');
  actions.appendChild(button('パス',()=>send('pass'),!usable||!acting||!v.field));
  const choices=(privateState?.legalMoves||[]).filter(m=>m.every(id=>selected.has(id))&&m.length===selected.size);
  const legal=choices.length>0;
  actions.appendChild(button('選択カードを出す（'+selected.size+'枚）',()=>{const ids=[...selected];selected.clear();send('play',{ids});},!usable||!acting||!legal));
  appendText(actions,legal?' 出せる組み合わせ':' 手札を選択してね','mini');
 }
 const cards=Array.isArray(privateState?.hand)?privateState.hand:[];
 appendText(hand,'あなたの手札（'+cards.length+'枚）','mini');
 const row=document.createElement('div');row.className='hand-cards';
 for(const c of cards){
  const id=uiCardId(c),canPlay=usable&&acting&&
    (game==='shichinarabe'&&(privateState?.legalIds||[]).includes(id)||game==='daifugo');
  const b=card(c,canPlay,canPlay?()=>{
   if(game==='shichinarabe'){
    // Seven: a single selected card, confirm with the action button.
    selected.has(id)?selected.clear():(selected.clear(),selected.add(id));
    lastRender='';render();
   }else {selected.has(id)?selected.delete(id):selected.add(id);lastRender='';render();}
  }:null);
  if(selected.has(id))b.classList.add('selected');
  row.appendChild(b);
 }
 hand.appendChild(row);
}
$('create').onclick=()=>startRoom(true);
$('join').onclick=()=>startRoom(false);
$('ready').onclick=()=>send('ready',{ready:!publicState.seats[mySeat].ready});
$('start').onclick=()=>send('start');
$('rematch').onclick=()=>{selected.clear();send('rematch');};
$('leave').onclick=()=>leaveRoom();
// Google Sites collection launcher can be in a sandboxed parent iframe.
// postMessage still works even when direct child DOM access is forbidden.
window.addEventListener('message',async event=>{
 if(event.source!==window.parent||event.data?.type!=='tc:leave-room')return;
 const requestId=event.data.requestId;
 if(typeof requestId!=='string'||!/^back-[0-9]{1,12}$/.test(requestId))return;
 try{await leaveRoom();}
 finally{
  window.parent.postMessage({type:'tc:leave-ack',requestId},'*');
 }
});
window.addEventListener('pagehide',()=>{session++;clearTimeout(tickTimer);});
window.TCFourRemote={get phase(){return publicState?.phase},get view(){return publicState},
 get privateView(){return privateState},get seat(){return mySeat},get role(){return stateName()},
 get status(){return $('status').textContent},create:()=>startRoom(true),join:()=>startRoom(false),
 command:send,leave:leaveRoom,stop:clear};

</script></body></html>
